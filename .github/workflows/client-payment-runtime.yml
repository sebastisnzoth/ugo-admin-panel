name: UGO Client Payment Runtime TEST

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/client-payment-runtime.mjs'
      - 'scripts/client-payment-judge.mjs'
      - 'scripts/client-payment-sentinel.mjs'
      - 'tests/contracts/client-payment-readiness.test.mjs'
      - 'supabase/migrations/20260930134500_client_payment_cash_audit.sql'
      - 'supabase/migrations/20260930135200_client_payment_readiness_service_role_grants.sql'
      - '.github/workflows/client-payment-runtime.yml'

concurrency:
  group: ugo-client-payment-runtime
  cancel-in-progress: false

permissions:
  contents: write

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
  UGO_TEST_CLIENT_EMAIL: cliente.ugo.test@example.com
  UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}

jobs:
  client-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refuse missing TEST credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$UGO_TEST_SUPABASE_URL" = "https://tmossnqfwfwjrtzwcbmm.supabase.co"
          test -n "$UGO_TEST_CLIENT_PASSWORD"
          test -n "$UGO_TEST_SUPABASE_SERVICE_ROLE_KEY"
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - name: Client payment contract regression
        run: node --test tests/contracts/client-payment-readiness.test.mjs tests/contracts/client-payment-recovery.test.mjs tests/contracts/client-payment-sentinel-sync.test.mjs tests/contracts/client-cash-close-sensitive-guard.test.mjs tests/contracts/cash-provider-ugo-debt.test.mjs
      - name: Runtime payment / YA PAGUÉ / debt ledger
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/client-payment-runtime.mjs
      - name: Judge
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/client-payment-judge.mjs
      - name: Sentinel
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/client-payment-sentinel.mjs
      - name: Persist VERIFIED closure
        shell: bash
        env:
          UGO_VALIDATED_SHA: ${{ github.sha }}
          UGO_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "ugo-readiness-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout -B readiness-client-payment-close origin/main
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const runtime=JSON.parse(fs.readFileSync('artifacts/client-payment-runtime.json','utf8'))
          const judge=JSON.parse(fs.readFileSync('artifacts/client-payment-judge.json','utf8'))
          const sentinel=JSON.parse(fs.readFileSync('artifacts/client-payment-sentinel.json','utf8'))
          if(runtime.result!=='PASS'||judge.result!=='PASS'||sentinel.result!=='PASS')throw new Error('CLIENT_PAYMENT_VALIDATORS_NOT_PASS')
          if(runtime.sha!==process.env.UGO_VALIDATED_SHA||judge.sha!==runtime.sha||sentinel.sha!==runtime.sha)throw new Error('CLIENT_PAYMENT_SAME_SHA_REQUIRED')
          if(runtime.production_touched!==false||runtime.cleanup_ok!==true)throw new Error('CLIENT_PAYMENT_UNSAFE_RUNTIME')
          const lockPath='docs/ugo-work-locks/readiness-client-payment.json'
          const lock=JSON.parse(fs.readFileSync(lockPath,'utf8'))
          const evidencePath='docs/evidence/readiness-client-payment-20260930.json'
          const evidence={
            readiness_id:'client-payment',
            task_id:'readiness-client-payment',
            environment:'UGO TEST',
            production_touched:false,
            runtime_validated_sha:runtime.sha,
            workflow_run_id:Number(process.env.UGO_WORKFLOW_RUN_ID),
            service_id:runtime.service_id,
            payment_id:runtime.payment_id,
            repeated_confirmation:runtime.repeated_confirmation,
            payment_rows:runtime.payment_rows,
            debt_rows:runtime.debt_rows,
            audit_rows:runtime.audit_rows,
            debt:runtime.debt,
            audit:runtime.audit,
            cleanup_ok:runtime.cleanup_ok,
            validators:{Judge:judge.result,Sentinel:sentinel.result},
            result:'PASS',
            verified_at:new Date().toISOString()
          }
          fs.mkdirSync('docs/evidence',{recursive:true})
          fs.writeFileSync(evidencePath,JSON.stringify(evidence,null,2)+'\n')
          const now=new Date().toISOString()
          lock.status='DONE'
          lock.heartbeat_at=now
          lock.lease_expires_at=null
          lock.current_step='DONE'
          lock.completed_at=now
          lock.runtime_validated_sha=runtime.sha
          lock.evidence_path=evidencePath
          lock.validators_result={Judge:'PASS',Sentinel:'PASS'}
          lock.judge='PASS'
          lock.sentinel='PASS'
          lock.production_touched=false
          lock.evidence_ids=[...new Set([...(lock.evidence_ids||[]),'workflow-run:'+process.env.UGO_WORKFLOW_RUN_ID,'serviceId:'+runtime.service_id,'paymentId:'+runtime.payment_id,'evidence:'+evidencePath])]
          fs.writeFileSync(lockPath,JSON.stringify(lock,null,2)+'\n')
          NODE
          git add docs/ugo-work-locks/readiness-client-payment.json docs/evidence/readiness-client-payment-20260930.json
          git commit -m "chore(readiness): close client-payment VERIFIED"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-payment-runtime-${{ github.sha }}
          path: artifacts/client-payment-*
          if-no-files-found: warn
          retention-days: 90
