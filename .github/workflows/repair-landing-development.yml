name: Repair landing development entry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-landing-development.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore Desarrollo entrypoint without touching landing design
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/landing/index.html')
          text = path.read_text()
          if 'href="/?app=development">Desarrollo</a>' in text:
              print('Desarrollo entrypoint already present')
              raise SystemExit(0)
          old = '<a href="/?app=admin">Administración</a></div><div><h4>UBICACIÓN</h4>'
          new = '<a href="/?app=admin">Administración</a><a href="/?app=development">Desarrollo</a></div><div><h4>UBICACIÓN</h4>'
          if old not in text:
              raise SystemExit('Expected ECOSISTEMA footer anchor not found; refusing broad rewrite')
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet -- public/landing/index.html; then
            exit 0
          fi
          git config user.name 'UGO Checklist Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add public/landing/index.html
          git commit -m 'fix(landing): restore development entrypoint'
          git push origin HEAD:main
