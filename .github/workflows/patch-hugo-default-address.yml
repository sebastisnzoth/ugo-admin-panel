name: Apply Hugo default address patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-hugo-default-address.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Hugo address resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/mvp/useHugoVoice.ts')
          src = path.read_text()

          helper_import = "import { resolveClientSavedAddress } from './hugoDefaultAddress'\n"
          if helper_import not in src:
              anchor = "import type { ClientActionHandlers, ClientHugoIntent } from './client/clientTypes'\n"
              src = src.replace(anchor, anchor + helper_import, 1)

          behavior = " 'Si el cliente ya tiene una dirección predeterminada guardada, usala sin volver a preguntarla; solo pedí dirección si no existe una utilizable o si el cliente indica otro lugar.',\n"
          if behavior not in src:
              anchor = " 'Para un pedido reuní categoría, descripción, dirección y cuándo. La foto es opcional. Confirmá antes de crear.',\n"
              src = src.replace(anchor, anchor + behavior, 1)

          pattern = r"async function resolveSavedPlace\(text:string\):Promise<SavedPlace\|null>\{.*?\}\nasync function harvestOrderFacts"
          replacement = "async function resolveSavedPlace(text:string):Promise<SavedPlace|null>{const label=savedPlaceLabel(text);return resolveClientSavedAddress(label)}\nasync function harvestOrderFacts"
          src, count = re.subn(pattern, replacement, src, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('resolveSavedPlace patch target not found')

          src = src.replace(
              "if(draft.step==='address'){await say(userText,pt?'Em que endereço é o serviço? Você pode dizer “na minha casa”.':'¿En qué dirección es el servicio? Podés decir “en mi casa”.');return}",
              "if(draft.step==='address'){await say(userText,pt?'Não encontrei um endereço salvo para este serviço. Qual é o endereço?':'No encontré una dirección guardada para este servicio. ¿Cuál es la dirección?');return}",
              1,
          )

          path.write_text(src)
          PY
          git diff --check
          git config user.name "ugo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/mvp/useHugoVoice.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(hugo): use client default address automatically"
            git push origin HEAD:main
          fi
