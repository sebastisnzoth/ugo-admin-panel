# retry: 2026-09-30T10:48Z after TEST Auth recovery
name: UGO Provider UI Runtime TEST
on:
  workflow_dispatch:

concurrency:
  group: ugo-test-shared-provider-fixture
  cancel-in-progress: false
jobs:
  provider-ui:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse missing TEST credentials
        shell: bash
        env:
          UGO_TEST_PROVIDER_PASSWORD: ${{ secrets.UGO_TEST_PROVIDER_PASSWORD }}
        run: test -n "$UGO_TEST_PROVIDER_PASSWORD"
      - run: npm ci --include=dev
      - name: Enforce UGO TEST
        env:
          UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
        run: npm run verify:test-env
      - name: Build exact SHA
        env:
          UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
          UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute Provider UI runtime proof
        shell: bash
        env:
          UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
          UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
          UGO_TEST_PROVIDER_EMAIL: proveedor.ugo.test@example.com
          UGO_TEST_PROVIDER_PASSWORD: ${{ secrets.UGO_TEST_PROVIDER_PASSWORD }}
          UGO_RUNTIME_SHA: ${{ github.sha }}
          UGO_UI_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/ugo-provider-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$UGO_UI_BASE_URL/?app=provider" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=provider" >/dev/null
          node scripts/provider-ui-runtime.mjs
      - name: Upload Provider UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-ui-runtime-${{ github.sha }}
          path: artifacts/provider-ui-*
          if-no-files-found: warn
          retention-days: 90
