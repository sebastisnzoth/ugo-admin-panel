name: Manual UGO Android APK Bundle

on:
  workflow_dispatch:

# Rebuild marker: native Hugo voice for Cliente + Proveedor
jobs:
  build-apks-manual:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 from runner SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Cliente, Proveedor y Admin
        working-directory: android-apk
        run: gradle :app:assembleClientDebug :app:assembleProviderDebug :app:assembleAdminDebug --no-daemon --stacktrace

      - name: Prepare APK files
        run: |
          mkdir -p apk-output
          cp android-apk/app/build/outputs/apk/client/debug/app-client-debug.apk apk-output/UGO-Cliente.apk
          cp android-apk/app/build/outputs/apk/provider/debug/app-provider-debug.apk apk-output/UGO-Proveedor.apk
          cp android-apk/app/build/outputs/apk/admin/debug/app-admin-debug.apk apk-output/UGO-Admin.apk
          sha256sum apk-output/*.apk > apk-output/SHA256SUMS.txt
          ls -lh apk-output

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: UGO-Android-APKs-Manual
          path: apk-output/*
          if-no-files-found: error
          retention-days: 30
