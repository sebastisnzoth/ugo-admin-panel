name: Build UGO Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-ugo-apks.yml'

# Rebuild marker: native Hugo voice for Cliente + Proveedor
jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Cliente y Proveedor
        working-directory: android-apk
        run: gradle :app:assembleClientDebug :app:assembleProviderDebug --no-daemon --stacktrace

      - name: Prepare APK files
        run: |
          mkdir -p apk-output
          cp android-apk/app/build/outputs/apk/client/debug/app-client-debug.apk apk-output/UGO-Cliente.apk
          cp android-apk/app/build/outputs/apk/provider/debug/app-provider-debug.apk apk-output/UGO-Proveedor.apk
          ls -lh apk-output

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: UGO-Android-APKs
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
