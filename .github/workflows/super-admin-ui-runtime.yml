name: UGO Super Admin UI Runtime TEST

on:
  push:
    branches: [main]
    paths:
      - "scripts/super-admin-ui-runtime.mjs"
      - "scripts/super-admin-ui-judge.mjs"
      - "scripts/super-admin-ui-sentinel.mjs"
      - "src/mvp/SuperAdminCommandCenter.tsx"
      - "src/mvp/AutonomousCorporationDashboard.tsx"
      - "tests/contracts/autonomous-dashboard-integrity.test.mjs"
      - "tests/contracts/admin-risk-surface.test.mjs"
      - ".github/workflows/super-admin-ui-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugo-super-admin-ui-runtime
  cancel-in-progress: false

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
  UGO_TEST_ADMIN_EMAIL: admin.ugo.test@example.com
  UGO_TEST_ADMIN_PASSWORD: ${{ secrets.UGO_TEST_ADMIN_PASSWORD }}

jobs:
  runtime-proof:
    name: Super Admin UI ↔ authoritative UGO TEST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refuse missing TEST credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$UGO_TEST_SUPABASE_URL" = "https://tmossnqfwfwjrtzwcbmm.supabase.co"
          test -n "$UGO_TEST_SUPABASE_SERVICE_ROLE_KEY"
          test -n "$UGO_TEST_ADMIN_PASSWORD"

      - name: Install repository dependencies
        run: npm ci --include=dev

      - name: Verify TEST-only environment
        run: npm run verify:test-env

      - name: TypeScript and production build
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build

      - name: Risk & Audit contract regression
        run: node --test tests/contracts/admin-risk-surface.test.mjs

      - name: Install transient Chromium harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Execute Super Admin browser proof
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="${GITHUB_SHA}"
          export VITE_APP_REVISION="${GITHUB_SHA}"
          export UGO_UI_BASE_URL="http://127.0.0.1:4173"
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ugo-superadmin-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$UGO_UI_BASE_URL/?app=admin" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=admin" >/dev/null
          node scripts/super-admin-ui-runtime.mjs

      - name: Judge runtime evidence
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/super-admin-ui-judge.mjs

      - name: Sentinel runtime evidence
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/super-admin-ui-sentinel.mjs

      - name: Upload immutable runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-admin-ui-runtime-${{ github.sha }}
          path: artifacts/super-admin-ui-*
          if-no-files-found: warn
          retention-days: 90
