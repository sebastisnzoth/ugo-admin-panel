name: UGO Cross Realtime Consistency TEST

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cross-realtime-consistency-*.mjs'
      - 'scripts/chat-realtime-probe.mjs'
      - 'tests/contracts/realtime-convergence.test.mjs'
      - 'tests/contracts/direct-assignment-realtime-convergence.test.mjs'
      - '.github/workflows/cross-realtime-consistency-runtime.yml'

permissions:
  contents: read

concurrency:
  group: ugo-test-shared-provider-fixture
  cancel-in-progress: false

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: ${{ secrets.UGO_TEST_SUPABASE_ANON_KEY }}
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
  UGO_TEST_CLIENT_EMAIL: cliente.ugo.test@example.com
  UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}
  UGO_TEST_PROVIDER_EMAIL: proveedor.ugo.test@example.com
  UGO_TEST_PROVIDER_PASSWORD: ${{ secrets.UGO_TEST_PROVIDER_PASSWORD }}
  UGO_RUNTIME_SHA: ${{ github.sha }}

jobs:
  runtime:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Require UGO TEST credentials
        run: |
          test -n "$UGO_TEST_SUPABASE_ANON_KEY"
          test -n "$UGO_TEST_SUPABASE_SERVICE_ROLE_KEY"
          test -n "$UGO_TEST_CLIENT_PASSWORD"
          test -n "$UGO_TEST_PROVIDER_PASSWORD"
      - name: Enforce UGO TEST
        run: npm run verify:test-env
      - name: Realtime convergence contracts
        run: node --test tests/contracts/realtime-convergence.test.mjs tests/contracts/direct-assignment-realtime-convergence.test.mjs
      - name: Build exact SHA
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Multi-role realtime runtime
        run: node scripts/cross-realtime-consistency-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cross-realtime-consistency-runtime-${{ github.sha }}
          path: artifacts/cross-realtime-consistency-runtime.json
          if-no-files-found: error
          retention-days: 90

  judge:
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: cross-realtime-consistency-runtime-${{ github.sha }}
          path: artifacts
      - run: node scripts/cross-realtime-consistency-judge.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cross-realtime-consistency-judge-${{ github.sha }}
          path: artifacts/cross-realtime-consistency-judge.json
          retention-days: 90

  sentinel:
    needs: judge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: cross-realtime-consistency-runtime-${{ github.sha }}
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: cross-realtime-consistency-judge-${{ github.sha }}
          path: artifacts
      - run: node scripts/cross-realtime-consistency-sentinel.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cross-realtime-consistency-sentinel-${{ github.sha }}
          path: artifacts/cross-realtime-consistency-sentinel.json
          retention-days: 90
