name: UGO Isolated RPC RLS
# Same-SHA final gate: bind isolated RLS, Core, Worker, Model Router and Sentinel validation to the same final SHA.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["UGO Core CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Both workflows mutate the same designated UGO TEST provider fixture.
  # Serialize them across workflow boundaries to avoid false P0 conflicts.
  group: ugo-test-shared-provider-fixture
  cancel-in-progress: false

env:
  # UGO TEST is the only allowed remote integration target. These are
  # browser-public values; credentials remain GitHub Actions secrets.
  UGO_REQUIRE_ISOLATED_INTEGRATION: '1'
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
  UGO_TEST_CLIENT_EMAIL: cliente.ugo.test@example.com
  UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}
  UGO_TEST_PROVIDER_EMAIL: proveedor.ugo.test@example.com
  UGO_TEST_PROVIDER_PASSWORD: ${{ secrets.UGO_TEST_PROVIDER_PASSWORD }}
  UGO_TEST_ADMIN_EMAIL: admin.ugo.test@example.com
  UGO_TEST_ADMIN_PASSWORD: ${{ secrets.UGO_TEST_ADMIN_PASSWORD }}

jobs:
  isolated-integration:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    name: Cliente ↔ Proveedor ↔ Admin isolated RPC/RLS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Enforce designated UGO TEST project and refuse production
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$UGO_TEST_SUPABASE_URL" == *"trfsjuseqjxlhrxuvdsm"* ]]; then
            echo "Refusing to run isolated integration against production."
            exit 1
          fi
          if [[ "$UGO_TEST_SUPABASE_URL" != "https://tmossnqfwfwjrtzwcbmm.supabase.co" ]]; then
            echo "Isolated integration must run only against the designated UGO TEST project."
            exit 1
          fi

      - name: Verify repository environment guard
        run: npm run verify:test-env

      - name: Require human TEST credentials before expensive validation
        shell: bash
        run: |
          set -euo pipefail

          required=(
            UGO_TEST_CLIENT_PASSWORD
            UGO_TEST_PROVIDER_PASSWORD
            UGO_TEST_ADMIN_PASSWORD
          )

          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Required UGO TEST GitHub Secrets are missing:"
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

          if [[ "$UGO_TEST_CLIENT_EMAIL" != "cliente.ugo.test@example.com" ]]; then
            echo "UGO_TEST_CLIENT_EMAIL must identify the designated TEST client account cliente.ugo.test@example.com."
            exit 1
          fi

          echo "All three UGO TEST password secrets are present."
          echo "Designated TEST client identity matches cliente.ugo.test@example.com."

      - name: Repair isolated TEST identities from GitHub Secrets
        if: ${{ env.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run bootstrap:test-auth

      - name: Explain unavailable automatic TEST credential repair
        if: ${{ env.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo "UGO_TEST_SUPABASE_SERVICE_ROLE_KEY is not configured; integration will validate the current TEST credentials without automatic repair."

      - name: TypeScript and production build
        run: npm run build

      - name: Core contract regression suite
        # Keep repository contracts independent from remote TEST credentials.
        # The authenticated RPC/RLS harness runs in the dedicated next step.
        run: node --test tests/contracts/*.test.mjs

      - name: Required isolated Cliente ↔ Proveedor ↔ Admin RPC/RLS harness
        run: npm run test:integration

      - name: Intellectual Property Gate runtime RPC/RLS
        if: ${{ env.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node --test tests/integration/ip-corporate-protection-rpc-rls.test.mjs

      - name: Autonomous Corporation runtime RPC/RLS
        if: ${{ env.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node --test tests/integration/autonomous-corporation-rpc-rls.test.mjs

      - name: Authenticated roles and permissions independent QA evidence
        if: ${{ env.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node scripts/autonomous-qa-auth-runtime.mjs

      - name: GPS geofence independent QA evidence
        if: ${{ env.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node scripts/autonomous-qa-gps-runtime.mjs

      - name: Verify autonomous department registry and persisted I/O
        if: ${{ env.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="$(git rev-parse HEAD)"
          node scripts/autonomous-departments-readiness-runtime.mjs
          node scripts/autonomous-departments-readiness-judge.mjs
          node scripts/autonomous-departments-readiness-sentinel.mjs

      - name: UGO Empresas TEST demand slots runtime
        if: ${{ env.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="$(git rev-parse HEAD)"
          node scripts/ugo-empresas-runtime.mjs

      - name: Realtime chat Cliente ↔ Proveedor without refresh
        run: node scripts/chat-realtime-probe.mjs

      - name: Verify Customer #1 gate with designated TEST Super Admin
        if: always()
        run: node scripts/autonomous-launch-gate-runtime.mjs

      - name: Install transient browser runtime for Super Admin proof
        if: ${{ always() && env.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Runtime-validate Super Admin UI against authoritative UGO TEST backend
        if: ${{ always() && env.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="$(git rev-parse HEAD)"
          export VITE_APP_REVISION="$UGO_RUNTIME_SHA"
          export UGO_UI_BASE_URL="http://127.0.0.1:4173"
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ugo-superadmin-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$UGO_UI_BASE_URL/?app=admin" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=admin" >/dev/null
          node scripts/super-admin-ui-runtime.mjs

      - name: Upload Super Admin runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-admin-ui-runtime-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            artifacts/super-admin-ui-runtime.*
            artifacts/ugo-empresas-runtime.png
            artifacts/auto-departments-runtime.json
            artifacts/auto-departments-judge.json
            artifacts/auto-departments-sentinel.json
          if-no-files-found: warn
          retention-days: 90
