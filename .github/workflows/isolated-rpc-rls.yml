name: UGO Isolated RPC RLS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugo-isolated-rpc-rls
  cancel-in-progress: false

jobs:
  isolated-integration:
    name: Cliente ↔ Proveedor isolated RPC/RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UGO_REQUIRE_ISOLATED_INTEGRATION: '1'
      UGO_TEST_SUPABASE_URL: ${{ secrets.UGO_TEST_SUPABASE_URL }}
      UGO_TEST_SUPABASE_ANON_KEY: ${{ secrets.UGO_TEST_SUPABASE_ANON_KEY }}
      UGO_TEST_CLIENT_EMAIL: ${{ secrets.UGO_TEST_CLIENT_EMAIL }}
      UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}
      UGO_TEST_PROVIDER_EMAIL: ${{ secrets.UGO_TEST_PROVIDER_EMAIL }}
      UGO_TEST_PROVIDER_PASSWORD: ${{ secrets.UGO_TEST_PROVIDER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Refuse production Supabase project
        shell: bash
        run: |
          if [[ "$UGO_TEST_SUPABASE_URL" == *"trfsjuseqjxlhrxuvdsm"* ]]; then
            echo "Refusing to run isolated integration against production Supabase."
            exit 1
          fi

      - name: TypeScript and production build
        run: npm run build

      - name: Required isolated Cliente ↔ Proveedor RPC/RLS harness
        run: npm run test:integration
