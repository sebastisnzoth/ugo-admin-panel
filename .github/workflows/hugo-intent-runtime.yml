name: UGO Hugo Intent Runtime TEST

on:
  push:
    branches: [main]
    paths:
      - "src/mvp/voiceCatalog.ts"
      - "src/mvp/hugoIntent.ts"
      - "src/features/client/hugo/hugoVoiceIntent.ts"
      - "src/features/client/hugo/ClientVoiceHugoDock.tsx"
      - "tests/contracts/hugo-intent-readiness.test.mjs"
      - "scripts/hugo-intent-runtime.mjs"
      - "scripts/hugo-intent-judge.mjs"
      - "scripts/hugo-intent-sentinel.mjs"
      - ".github/workflows/hugo-intent-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugo-hugo-intent-runtime
  cancel-in-progress: false

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_CLIENT_EMAIL: cliente.ugo.test@example.com
  UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}

jobs:
  runtime-proof:
    name: Hugo intent catalog + flow actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse missing TEST credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$UGO_TEST_SUPABASE_URL" = "https://tmossnqfwfwjrtzwcbmm.supabase.co"
          test -n "$UGO_TEST_CLIENT_PASSWORD"
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - name: Permanent intent regression
        run: node --test tests/contracts/client-hugo-voice-intent-behavior.test.mjs tests/contracts/client-voice-order-catalog.test.mjs tests/contracts/hugo-intent-readiness.test.mjs
      - name: Build exact SHA
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Execute UGO TEST intent proof
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="${GITHUB_SHA}"
          node scripts/hugo-intent-runtime.mjs
          node scripts/hugo-intent-judge.mjs
          node scripts/hugo-intent-sentinel.mjs
      - name: Upload Hugo intent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hugo-intent-runtime-${{ github.sha }}
          path: artifacts/hugo-intent-*
          if-no-files-found: warn
          retention-days: 90
