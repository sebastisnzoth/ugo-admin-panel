name: Export Vercel Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-vercel-runtime.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package runtime source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          for path in src api public package.json package-lock.json index.html vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json vercel.json; do
            if [ -e "$path" ]; then
              cp -R --parents "$path" export/
            fi
          done
          tar -C export -czf ugo-vercel-runtime.tar.gz .
          find export -type f | sort > runtime-files.txt
          wc -c ugo-vercel-runtime.tar.gz
          wc -l runtime-files.txt

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: ugo-vercel-runtime
          path: |
            ugo-vercel-runtime.tar.gz
            runtime-files.txt
          if-no-files-found: error
          retention-days: 2
