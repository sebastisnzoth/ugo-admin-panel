name: UGO Cross-role UI Runtime TEST

on:
  push:
    branches: [main]
    paths:
      - "scripts/role-ui-runtime.mjs"
      - "scripts/admin-user-persistence-runtime.mjs"
      - "scripts/role-ui-fixtures.mjs"
      - "scripts/admin-api-runtime-server.mjs"
      - "api/operations.ts"
      - "api/admin/integrations-status.ts"
      - ".github/workflows/role-ui-runtime.yml"
      - "src/features/client/**"
      - "src/mvp/**"
      - "src/components/**"
      - "src/hooks/**"
      - "src/i18n/**"
  pull_request:
    branches: [main]
    paths:
      - "scripts/role-ui-runtime.mjs"
      - "scripts/admin-user-persistence-runtime.mjs"
      - "scripts/role-ui-fixtures.mjs"
      - "scripts/admin-api-runtime-server.mjs"
      - "api/operations.ts"
      - "api/admin/integrations-status.ts"
      - "src/features/client/**"
      - "src/mvp/**"
      - "src/components/**"
      - "src/hooks/**"
      - "src/i18n/**"
      - "tests/contracts/client-navigation-readiness.test.mjs"
      - "docs/evidence/client-navigation-readiness-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugo-test-scheduled-worker-proof-autonomy-state
  cancel-in-progress: false

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  runtime-proof:
    name: Cliente + Proveedor + Admin responsive/browser proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse missing TEST credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$UGO_TEST_SUPABASE_URL" = "https://tmossnqfwfwjrtzwcbmm.supabase.co"
          test -n "$UGO_TEST_SUPABASE_SERVICE_ROLE_KEY"
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - name: Build exact SHA
        env:
          VITE_APP_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          VITE_API_BASE_URL: http://127.0.0.1:4174
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute cross-role UI runtime proof
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          export VITE_APP_REVISION="${{ github.event.pull_request.head.sha || github.sha }}"
          export UGO_UI_BASE_URL="http://127.0.0.1:4173"
          node scripts/admin-api-runtime-server.mjs > /tmp/ugo-role-api.log 2>&1 &
          api_pid=$!
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ugo-role-ui-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 "$UGO_UI_BASE_URL/?app=client" >/dev/null; then ready=1; break; fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              echo "VITE_EXITED_BEFORE_RUNTIME"
              cat /tmp/ugo-role-ui-vite.log || true
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "VITE_START_TIMEOUT"
            cat /tmp/ugo-role-ui-vite.log || true
            exit 1
          fi
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4174/__health
          node scripts/i18n-login-runtime.mjs
          node scripts/role-ui-runtime.mjs
      - name: Upload UI runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-ui-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/role-ui-*
          if-no-files-found: warn
          retention-days: 90
