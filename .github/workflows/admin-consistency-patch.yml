name: Admin consistency patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/admin-consistency-patch.yml'
      - 'scripts/admin-consistency-patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply consistency patch
        run: python3 scripts/admin-consistency-patch.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "ugo-ci-bot"
          git config user.email "ugo-ci-bot@users.noreply.github.com"
          git add src/hooks/useAdminData.ts src/mvp/AdminNativeModules.tsx src/mvp/AdminSystemSettings.tsx
          git commit -m "fix(admin): harden live operations and finance views"
          git push origin HEAD:main
