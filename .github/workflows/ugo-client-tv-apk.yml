name: UGO Cliente TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ugo-client-android-tv
    paths:
      - 'android-apk/**'
      - '.github/workflows/ugo-client-tv-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build TV APK (debug, sideload)
        working-directory: android-apk
        run: gradle :app:assembleTvclientDebug --no-daemon --stacktrace
      - name: Upload UGO Cliente TV APK
        uses: actions/upload-artifact@v4
        with:
          name: UGO-Cliente-TV-APK
          path: android-apk/app/build/outputs/apk/tvclient/debug/*.apk
          if-no-files-found: error
          retention-days: 14
