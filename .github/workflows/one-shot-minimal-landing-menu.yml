name: One-shot minimal landing menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-minimal-landing-menu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply minimal menu and development link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('public/landing/index.html')
          text = path.read_text()

          css = r'''
          /* UGO MINIMAL NAVIGATION v2 */
          .top{background:rgba(255,255,255,.94);border-bottom:1px solid #ececec}
          .nav{height:68px;gap:20px;position:relative}
          .brand{font-size:29px;letter-spacing:-2.2px}
          .location{display:none!important}
          .navlinks{gap:24px;font-size:13px;font-weight:600;color:#686868}
          .navlinks .devlink{color:#9a9a9a;font-size:12px}
          .navactions{gap:8px}
          .textbtn{font-size:13px;font-weight:650;color:#555;padding:9px 8px}
          .navactions .btn{min-height:40px;padding:0 17px;font-size:13px}
          .hamb{display:none;border:0;background:#f5f5f5;border-radius:999px;width:40px;height:40px;font-size:18px;line-height:1;color:#111}
          .mobilemenu{display:none}
          @media(max-width:980px){
            .navlinks{display:none!important}.hamb{display:grid!important;place-items:center}.navactions{margin-left:auto}
            .mobilemenu{position:absolute!important;top:56px!important;right:0!important;left:auto!important;width:min(300px,calc(100vw - 28px))!important;padding:8px!important;background:rgba(255,255,255,.98)!important;border:1px solid #e8e8e8!important;border-radius:18px!important;box-shadow:0 18px 50px rgba(0,0,0,.12)!important}
            .mobilemenu.open{display:block!important}.mobilemenu a{display:flex!important;align-items:center;justify-content:space-between;min-height:44px;padding:0 13px!important;border:0!important;border-radius:12px;font-size:13px;font-weight:700;color:#333}.mobilemenu a:hover{background:#f6f6f6}.mobilemenu a.dev{color:#777;border-top:1px solid #eee!important;margin-top:5px}
          }
          @media(min-width:681px) and (max-width:900px){.mobilebar{display:none!important}body{padding-bottom:0!important}}
          @media(max-width:680px){
            .nav{height:62px}.brand{font-size:27px}.navactions .textbtn,.navactions .btn{display:none!important}.mobilemenu{top:52px!important}
            .mobilebar{display:flex!important;background:rgba(255,255,255,.96)!important;border:1px solid #e5e5e5!important;box-shadow:0 10px 34px rgba(0,0,0,.13)!important}.mobilebar .client{background:#0a0a0a!important;color:#fff!important}.mobilebar .provider{background:#fff!important;color:#111!important;border:1px solid #e0e0e0!important}
          }
          '''
          if 'UGO MINIMAL NAVIGATION v2' not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          header = '''<header class="top"><div class="wrap nav"><a class="brand" href="/landing/" aria-label="UGO inicio">UGO</a><nav class="navlinks" aria-label="Navegación principal"><a href="#como-funciona">Cómo funciona</a><a href="#seguridad">Seguridad</a><a class="devlink" href="/?app=development">Desarrollo</a></nav><div class="navactions"><a class="textbtn" href="/?app=client">Entrar</a><a class="btn dark" href="/?app=client">Buscar servicio</a><button class="hamb" id="menuBtn" type="button" aria-label="Abrir menú" aria-expanded="false">☰</button></div><div class="mobilemenu" id="mobileMenu" aria-label="Menú"><a href="#como-funciona">Cómo funciona <span>→</span></a><a href="#seguridad">Seguridad <span>→</span></a><a href="/?app=client">Cliente <span>→</span></a><a href="/?app=provider">Profesional <span>→</span></a><a class="dev" href="/?app=development">Desarrollo <span>→</span></a></div></div></header>'''
          text, n = re.subn(r'<header class="top">.*?</header>', header, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Landing header not found')

          footer = '''<footer class="footer"><div class="wrap"><div class="footgrid"><div><div class="footbrand">UGO</div><p>Servicios cuando los necesitás. Personas reales, soluciones reales.</p></div><div><h4>NAVEGACIÓN</h4><a href="#servicios">Servicios</a><a href="#como-funciona">Cómo funciona</a><a href="#seguridad">Seguridad</a></div><div><h4>ACCESOS</h4><a href="/?app=client">Cliente</a><a href="/?app=provider">Profesional</a><a href="/?app=development">Desarrollo</a></div><div><h4>GESTIÓN</h4><a href="/?app=admin">Administración</a><a href="#">Florianópolis, SC</a></div></div><div class="copy"><span>© 2026 UGO.</span><span><a href="#seguridad">Términos</a><a href="#seguridad">Privacidad</a></span></div></div></footer>'''
          text, n = re.subn(r'<footer class="footer">.*?</footer>', footer, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Landing footer not found')

          text, n = re.subn(r'<div class="mobilebar">.*?</div>', '<div class="mobilebar"><a class="client" href="/?app=client">Cliente</a><a class="provider" href="/?app=provider">Profesional</a></div>', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Landing mobile bar not found')

          if text.count('href="/?app=development"') < 3:
              raise SystemExit('Development link missing after patch')

          path.write_text(text)
          PY
      - name: Commit landing update
        shell: bash
        run: |
          if git diff --quiet -- public/landing/index.html; then
            echo 'No landing changes required'
            exit 0
          fi
          git config user.name 'UGO Landing Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add public/landing/index.html
          git commit -m 'feat(landing): minimal menus and development link'
          git push origin HEAD:main
