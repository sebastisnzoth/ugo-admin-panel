name: Apply client guided default address patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-client-guided-default-address.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch guided request default address
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mvp/client/ClientGuidedRequest.tsx')
          src = path.read_text()

          old_question = "function currentQuestion(draft:Draft){if(!draft.address)return'¿Dónde es el servicio? Podés decir “en mi casa”, “en el trabajo”, elegir una dirección guardada o usar tu ubicación actual.';if(!draft.categoryId)return'¿Qué profesional necesitás? Por ejemplo electricista, jardinero, limpieza o plomero.';if(draft.description.trim().length<8)return'Contame qué pasó o qué trabajo necesitás hacer.';if(!draft.whenConfirmed)return'¿Cuándo lo necesitás? Podés decir “ahora”, “hoy” o “mañana a las 10”.';if(draft.when==='programar'&&!draft.scheduleAt)return'¿Para qué día y hora querés programarlo?';return'¿Querés agregar alguna indicación? Por ejemplo “que sea puntual” o “que me avise antes de llegar”. Si ya está todo, decime “confirmar”.'}"
          new_question = "function currentQuestion(draft:Draft){if(!draft.categoryId)return'¿Qué profesional necesitás? Por ejemplo electricista, jardinero, limpieza o plomero.';if(draft.description.trim().length<8)return'Contame qué pasó o qué trabajo necesitás hacer.';if(!draft.address)return'No encontré una dirección guardada para este pedido. ¿Dónde es el servicio?';if(!draft.whenConfirmed)return'¿Cuándo lo necesitás? Podés decir “ahora”, “hoy” o “mañana a las 10”.';if(draft.when==='programar'&&!draft.scheduleAt)return'¿Para qué día y hora querés programarlo?';return'¿Querés agregar alguna indicación? Por ejemplo “que sea puntual” o “que me avise antes de llegar”. Si ya está todo, decime “confirmar”.'}"
          if old_question not in src:
              raise SystemExit('currentQuestion target not found')
          src = src.replace(old_question, new_question, 1)

          src = src.replace(
              "[hugoText,setHugoText]=useState(''),[hugoReply,setHugoReply]=useState('Decime dónde es el servicio y vamos completando juntos.')",
              "[hugoText,setHugoText]=useState(''),[hugoReply,setHugoReply]=useState('Contame qué necesitás y completo el pedido con los datos que ya tenés guardados.')",
              1,
          )

          old_restore = "setAddresses(saved);let restored:Partial<Draft>={};try{restored=JSON.parse(sessionStorage.getItem(`ugo:guided-request-draft:${session.user.id}`)||'{}')as Partial<Draft>}catch(error){console.warn('No pudimos restaurar el borrador local.',error)}setDraft(value=>({...value,...restored,whenConfirmed:Boolean(restored.whenConfirmed)}));"
          new_restore = "setAddresses(saved);let restored:Partial<Draft>={};try{restored=JSON.parse(sessionStorage.getItem(`ugo:guided-request-draft:${session.user.id}`)||'{}')as Partial<Draft>}catch(error){console.warn('No pudimos restaurar el borrador local.',error)}const preferredAddress=savedRows.find(address=>address.esPrincipal)||saved.find(address=>address.id==='profile-home')||(saved.length===1?saved[0]:null);setDraft(value=>{const next={...value,...restored,whenConfirmed:Boolean(restored.whenConfirmed)} as Draft;if(!next.address&&preferredAddress){next.address=preferredAddress.direccion;next.addressLabel=preferredAddress.etiqueta||'Casa'}return next});"
          if old_restore not in src:
              raise SystemExit('draft restore target not found')
          src = src.replace(old_restore, new_restore, 1)

          old_open = "const openRequest=useCallback(()=>{if(hasActive){if(MATCHING_STATES.includes(activeState)){setMatchingSeconds(0);setStep('matching')}else{setMessage('Ya tenés un servicio en curso. Podés seguirlo desde Inicio.');flow.navigate('home')}return}setStep('request');setMessage('');setHugoReply(currentQuestion(draft))},[activeState,draft,flow,hasActive])"
          new_open = "const openRequest=useCallback(()=>{if(hasActive){if(MATCHING_STATES.includes(activeState)){setMatchingSeconds(0);setStep('matching')}else{setMessage('Ya tenés un servicio en curso. Podés seguirlo desde Inicio.');flow.navigate('home')}return}const preferred=addresses.find(address=>address.id!=='profile-home'&&address.esPrincipal)||addresses.find(address=>address.id==='profile-home')||(addresses.length===1?addresses[0]:null),next=!draft.address&&preferred?{...draft,address:preferred.direccion,addressLabel:preferred.etiqueta||'Casa'}:draft;if(next!==draft)setDraft(next);setStep('request');setMessage('');setHugoReply(currentQuestion(next))},[activeState,addresses,draft,flow,hasActive])"
          if old_open not in src:
              raise SystemExit('openRequest target not found')
          src = src.replace(old_open, new_open, 1)

          path.write_text(src)
          PY
          git diff --check
          git config user.name "ugo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/mvp/client/ClientGuidedRequest.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix(client): prefill saved address in guided request"
            git push origin HEAD:main
          fi
