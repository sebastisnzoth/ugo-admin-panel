name: UGO Hugo Presence Runtime TEST

on:
  push:
    branches: [main]
    paths:
      - "scripts/hugo-presence-runtime.mjs"
      - ".github/workflows/hugo-presence-runtime.yml"
      - "src/features/client/**"
      - "src/mvp/provider/**"
      - "src/mvp/AdminPhase2.tsx"
      - "src/components/ConversationalOrb.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugo-hugo-presence-runtime
  cancel-in-progress: false

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_CLIENT_EMAIL: cliente@ugo.com.ar
  UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}
  UGO_TEST_PROVIDER_EMAIL: proveedor.ugo.test@example.com
  UGO_TEST_PROVIDER_PASSWORD: ${{ secrets.UGO_TEST_PROVIDER_PASSWORD }}
  UGO_TEST_ADMIN_EMAIL: admin.ugo.test@example.com
  UGO_TEST_ADMIN_PASSWORD: ${{ secrets.UGO_TEST_ADMIN_PASSWORD }}

jobs:
  runtime-proof:
    name: Hugo visible Cliente + Proveedor + Admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse missing TEST credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$UGO_TEST_SUPABASE_URL" = "https://tmossnqfwfwjrtzwcbmm.supabase.co"
          test -n "$UGO_TEST_CLIENT_PASSWORD"
          test -n "$UGO_TEST_PROVIDER_PASSWORD"
          test -n "$UGO_TEST_ADMIN_PASSWORD"
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - name: Build exact SHA
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute Hugo presence runtime proof
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="${GITHUB_SHA}"
          export VITE_APP_REVISION="${GITHUB_SHA}"
          export UGO_UI_BASE_URL="http://127.0.0.1:4173"
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ugo-hugo-presence-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$UGO_UI_BASE_URL/?app=client" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=client" >/dev/null
          node scripts/hugo-presence-runtime.mjs
      - name: Upload Hugo presence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hugo-presence-runtime-${{ github.sha }}
          path: artifacts/hugo-presence-*
          if-no-files-found: warn
          retention-days: 90
