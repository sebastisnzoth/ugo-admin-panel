name: UGO Android APKs
# Rebuild requested after Android Cliente scroll fixes (2026-10-30).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-apk/**'
      - '.github/workflows/android-apks.yml'
  push:
    branches: [main]
    paths:
      - 'android-apk/**'
      - '.github/workflows/android-apks.yml'
permissions:
  contents: read
jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build four APKs
        working-directory: android-apk
        run: |
          GRADLE_VERSION=8.11.1
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle --no-daemon clean assembleClientDebug assembleProviderDebug assembleAdminDebug assembleTvclientDebug
      - name: Stage APKs
        run: |
          mkdir -p apk-artifacts
          cp android-apk/app/build/outputs/apk/client/debug/app-client-debug.apk apk-artifacts/UGO-Cliente.apk
          cp android-apk/app/build/outputs/apk/provider/debug/app-provider-debug.apk apk-artifacts/UGO-Proveedor.apk
          cp android-apk/app/build/outputs/apk/admin/debug/app-admin-debug.apk apk-artifacts/UGO-Admin.apk
          cp android-apk/app/build/outputs/apk/tvclient/debug/app-tvclient-debug.apk apk-artifacts/UGO-Cliente-TV.apk
          sha256sum apk-artifacts/*.apk | tee apk-artifacts/SHA256SUMS.txt
          ls -lh apk-artifacts/*.apk

      - name: Verify APK integrity and package IDs
        shell: bash
        run: |
          set -euo pipefail
          AAPT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools/35.0.0/aapt"
          test -x "$AAPT"

          declare -A expected=(
            [UGO-Cliente.apk]="com.ugo.client"
            [UGO-Proveedor.apk]="com.ugo.provider"
            [UGO-Admin.apk]="com.ugo.admin"
            [UGO-Cliente-TV.apk]="com.ugo.client.tv"
          )

          for apk in UGO-Cliente.apk UGO-Proveedor.apk UGO-Admin.apk UGO-Cliente-TV.apk; do
            path="apk-artifacts/$apk"
            test -s "$path"
            unzip -tq "$path" >/dev/null
            unzip -l "$path" | grep -q 'AndroidManifest.xml'
            unzip -l "$path" | grep -q 'classes.dex'

            badging="$("$AAPT" dump badging "$path")"
            package="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
            if [[ "$package" != "${expected[$apk]}" ]]; then
              echo "Unexpected package for $apk: $package (expected ${expected[$apk]})"
              exit 1
            fi
            if [[ "$apk" == "UGO-Cliente-TV.apk" ]]; then
              echo "$badging" | grep -q "^launchable-activity: name='com.ugo.mobile.TvActivity'"
              manifest_tree="$("$AAPT" dump xmltree "$path" AndroidManifest.xml)"
              if grep -q 'com.ugo.mobile.MainActivity' <<<"$manifest_tree"; then
                echo "TV APK still declares portrait phone MainActivity"
                exit 1
              fi
              grep -q 'com.ugo.mobile.TvActivity' <<<"$manifest_tree"
              echo "TV launcher verified: only TvActivity is declared"
            fi
            printf '%s package=%s bytes=%s\n' "$apk" "$package" "$(stat -c%s "$path")"
          done

          unique_hashes="$(sha256sum apk-artifacts/UGO-*.apk | awk '{print $1}' | sort -u | wc -l)"
          if [[ "$unique_hashes" -ne 4 ]]; then
            echo "The four role APKs must have distinct binary hashes."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: UGO-Cliente
          path: apk-artifacts/UGO-Cliente.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UGO-Proveedor
          path: apk-artifacts/UGO-Proveedor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UGO-Admin
          path: apk-artifacts/UGO-Admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UGO-APK-SHA256
          path: apk-artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: UGO-Cliente-TV
          path: apk-artifacts/UGO-Cliente-TV.apk
