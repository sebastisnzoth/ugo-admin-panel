name: UGO Provider Arrival Runtime TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugo-test-shared-provider-fixture
  cancel-in-progress: false

jobs:
  arrival-runtime:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Require UGO TEST credentials
        shell: bash
        env:
          UGO_TEST_PROVIDER_PASSWORD: ${{ secrets.UGO_TEST_PROVIDER_PASSWORD }}
          UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$UGO_TEST_PROVIDER_PASSWORD"
          test -n "$UGO_TEST_SUPABASE_SERVICE_ROLE_KEY"
      - name: Enforce UGO TEST
        env:
          UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
        run: npm run verify:test-env
      - name: Arrival contract gates
        run: node --test tests/contracts/provider-arrival-gps-gate.test.mjs tests/contracts/provider-arrival-location.test.mjs
      - name: Build exact SHA
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Execute authenticated arrival geofence runtime
        env:
          UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
          UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
          UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
          UGO_TEST_PROVIDER_EMAIL: proveedor.ugo.test@example.com
          UGO_TEST_PROVIDER_PASSWORD: ${{ secrets.UGO_TEST_PROVIDER_PASSWORD }}
          UGO_RUNTIME_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/autonomous-qa-gps-runtime.mjs | tee artifacts/provider-arrival-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-arrival-runtime-${{ github.sha }}
          path: artifacts/provider-arrival-runtime.json
          if-no-files-found: error
          retention-days: 90

  judge:
    needs: arrival-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: provider-arrival-runtime-${{ github.sha }}
          path: artifacts
      - name: Judge provider arrival evidence
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/provider-arrival-judge.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: provider-arrival-judge-${{ github.sha }}
          path: artifacts/provider-arrival-judge.json
          if-no-files-found: error
          retention-days: 90

  sentinel:
    needs: judge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: provider-arrival-runtime-${{ github.sha }}
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: provider-arrival-judge-${{ github.sha }}
          path: artifacts
      - name: Sentinel provider arrival evidence
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/provider-arrival-sentinel.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: provider-arrival-sentinel-${{ github.sha }}
          path: artifacts/provider-arrival-sentinel.json
          if-no-files-found: error
          retention-days: 90
