name: UGO Client Request Runtime TEST

on:
  push:
    branches: [main]
    paths:
      - "scripts/client-request-runtime.mjs"
      - "scripts/client-request-judge.mjs"
      - "scripts/client-request-sentinel.mjs"
      - "src/features/client/request/**"
      - "src/features/client/payments/**"
      - "src/lib/dispatch/**"
      - ".github/workflows/client-request-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugo-client-request-runtime
  cancel-in-progress: false

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_CLIENT_EMAIL: cliente@ugo.com.ar
  UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}

jobs:
  runtime-proof:
    name: Cliente crear solicitud completa ↔ UGO TEST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse missing TEST credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$UGO_TEST_SUPABASE_URL" = "https://tmossnqfwfwjrtzwcbmm.supabase.co"
          test -n "$UGO_TEST_CLIENT_PASSWORD"
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - name: TypeScript and build
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Contract regressions
        run: node --test tests/contracts/client-service-pickup-location.test.mjs tests/contracts/client-hugo-location-contract.test.mjs tests/contracts/client-hugo-voice-written-parity.test.mjs
      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Create request through UI and compare backend
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="${GITHUB_SHA}"
          export VITE_APP_REVISION="${GITHUB_SHA}"
          export UGO_UI_BASE_URL="http://127.0.0.1:4173"
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/ugo-client-request-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$UGO_UI_BASE_URL/?app=client" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=client" >/dev/null
          node scripts/client-request-runtime.mjs
      - name: Judge
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/client-request-judge.mjs
      - name: Sentinel
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/client-request-sentinel.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-request-runtime-${{ github.sha }}
          path: artifacts/client-request-*
          if-no-files-found: warn
          retention-days: 90
