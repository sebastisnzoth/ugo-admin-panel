name: UGO Provider Notifications Runtime TEST

on:
  push:
    branches: [main]
    paths:
      - "scripts/provider-notifications-*.mjs"
      - ".github/workflows/provider-notifications-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugo-readiness-provider-notifications
  cancel-in-progress: false

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  provider-notifications:
    name: Provider notifications · UGO TEST · Judge · Sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse missing TEST credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$UGO_TEST_SUPABASE_URL" = "https://tmossnqfwfwjrtzwcbmm.supabase.co"
          test -n "$UGO_TEST_SUPABASE_SERVICE_ROLE_KEY"
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - name: Build exact SHA
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Notification contract regression
        run: node --test tests/contracts/*notification*.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Provider notification web runtime
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="${GITHUB_SHA}"
          export UGO_UI_BASE_URL="http://127.0.0.1:4173"
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/provider-notifications-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS "$UGO_UI_BASE_URL/?app=provider" >/dev/null && break || sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=provider" >/dev/null
          node scripts/provider-notifications-runtime.mjs
      - name: Independent Judge
        run: node scripts/provider-notifications-judge.mjs
      - name: Sentinel
        run: node scripts/provider-notifications-sentinel.mjs
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-provider-notifications-${{ github.sha }}
          path: |
            artifacts/provider-notifications-*
            /tmp/provider-notifications-vite.log
          if-no-files-found: warn
          retention-days: 90
