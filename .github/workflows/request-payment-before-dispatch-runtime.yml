name: UGO Payment Before Dispatch Runtime TEST

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260930222500_payment_before_dispatch_guard.sql'
      - 'scripts/request-payment-before-dispatch-*.mjs'
      - 'tests/contracts/request-payment-before-dispatch.test.mjs'
      - '.github/workflows/request-payment-before-dispatch-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
  UGO_TEST_CLIENT_EMAIL: cliente.ugo.test@example.com
  UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - run: node --test tests/contracts/request-payment-before-dispatch.test.mjs
      - name: Runtime
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/request-payment-before-dispatch-runtime.mjs
      - name: Judge
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/request-payment-before-dispatch-judge.mjs
      - name: Sentinel
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/request-payment-before-dispatch-sentinel.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-payment-before-dispatch-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/request-payment-before-dispatch-*
          if-no-files-found: warn
          retention-days: 90
