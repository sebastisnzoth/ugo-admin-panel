name: UGO Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'perf/**'
      - 'security/**'

concurrency:
  group: ugo-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript · Build · Core Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UGO_TEST_SUPABASE_URL: ${{ secrets.UGO_TEST_SUPABASE_URL }}
      UGO_TEST_SUPABASE_ANON_KEY: ${{ secrets.UGO_TEST_SUPABASE_ANON_KEY }}
      UGO_TEST_CLIENT_EMAIL: ${{ secrets.UGO_TEST_CLIENT_EMAIL }}
      UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}
      UGO_TEST_PROVIDER_EMAIL: ${{ secrets.UGO_TEST_PROVIDER_EMAIL }}
      UGO_TEST_PROVIDER_PASSWORD: ${{ secrets.UGO_TEST_PROVIDER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: TypeScript and production build
        run: npm run build

      - name: Core lifecycle, market and isolated RPC/RLS tests
        run: npm test

      - name: Lint critical operational surfaces
        run: >-
          npx eslint
          api/admin/integrations-status.ts
          api/pagos/ajuste-ampliacion.ts
          api/pagos/webhook.ts
          src/mvp/AdminSystemSettings.tsx
          src/mvp/AdminPaymentCredentials.tsx
          src/mvp/AdminPaymentMethods.tsx
          src/mvp/MvpApp.tsx
          src/mvp/client/ClientRoot.tsx
          src/mvp/client/ClientGuidedRequest.tsx
          src/mvp/client/ClientPaymentChoice.tsx
          src/mvp/client/ClientHugoBridge.tsx
          src/mvp/ClientCompletionReview.tsx
          src/mvp/ServiceExpansionPanel.tsx
          src/mvp/NotificationCenter.tsx
          src/mvp/PaymentTimeline.tsx
          src/mvp/ClientLiveTracking.tsx
          src/mvp/ClientActiveMap.tsx
          src/mvp/ClientGlobalMenu.tsx
          src/mvp/AppLocationButton.tsx
          src/mvp/VoiceHugoDock.tsx
          src/mvp/uiEvents.ts
          src/mvp/ProviderLocationTracker.tsx
          src/mvp/provider/ProviderRoot.tsx
          src/mvp/provider/ProviderHome.tsx
          src/mvp/provider/ProviderDemand.tsx
          src/mvp/provider/ProviderDemandMap.tsx
          src/mvp/provider/ProviderOpportunities.tsx
          src/mvp/provider/ProviderActiveJob.tsx
          src/mvp/provider/ProviderEvidencePanel.tsx
          src/mvp/provider/providerService.ts
          src/mvp/provider/useProviderRealtime.ts
          tests/integration/client-provider-rpc-rls.test.mjs

      - name: Lint ClientApp excluding registered legacy effect debt
        run: >-
          npx eslint src/mvp/ClientApp.tsx
          --rule 'react-hooks/set-state-in-effect: off'
          --rule 'no-empty: off'

      - name: Full repository lint debt report
        continue-on-error: true
        run: npm run lint
