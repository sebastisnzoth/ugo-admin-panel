name: UGO Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'

concurrency:
  group: ugo-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript · Build · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and production build
        run: npm run build

      - name: Lint
        run: npm run lint
