name: UGO Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'perf/**'
      - 'security/**'

concurrency:
  group: ugo-core-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript · Build · Core Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # UGO TEST is the only allowed remote integration target. These two
      # values are browser-public and intentionally match isolated-rpc-rls.yml.
      UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
      UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
      UGO_TEST_CLIENT_EMAIL: cliente@ugo.com.ar
      UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}
      UGO_TEST_PROVIDER_EMAIL: proveedor.ugo.test@example.com
      UGO_TEST_PROVIDER_PASSWORD: ${{ secrets.UGO_TEST_PROVIDER_PASSWORD }}
      UGO_TEST_ADMIN_EMAIL: admin.ugo.test@example.com
      UGO_TEST_ADMIN_PASSWORD: ${{ secrets.UGO_TEST_ADMIN_PASSWORD }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Require OpenRouter secret for autonomous company
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "OPENROUTER_API_KEY GitHub Actions secret is required for UGO Autonomous Company."
            exit 1
          fi
          echo "OpenRouter secret is configured (value intentionally hidden)."

      - name: Validate OpenRouter free-first route
        run: node scripts/openrouter-autonomy-probe.mjs

      - name: TypeScript and production build
        run: npm run build

      - name: Core contract suite
        # Remote authenticated/mutating TEST coverage is owned by the chained
        # UGO Isolated RPC RLS workflow. Core must not compete for that fixture.
        run: node --test --test-concurrency=1 tests/contracts/*.test.mjs

      - name: Lint critical operational surfaces
        run: >-
          npx eslint
          api/admin/integrations-status.ts
          api/pagos/ajuste-ampliacion.ts
          api/pagos/webhook.ts
          src/mvp/AdminSystemSettings.tsx
          src/mvp/AdminPaymentCredentials.tsx
          src/mvp/AdminPaymentMethods.tsx
          src/mvp/MvpApp.tsx
          src/mvp/client/ClientRoot.tsx
          src/features/client/payments/ClientPaymentChoice.tsx
          src/features/client/hugo/ClientHugoBridge.tsx
          src/features/client/hugo/ClientVoiceHugoDock.tsx
          src/features/client/order/ClientCompletionReview.tsx
          src/mvp/ServiceExpansionPanel.tsx
          src/mvp/NotificationCenter.tsx
          src/mvp/PaymentTimeline.tsx
          src/features/client/order/ClientLiveTracking.tsx
          src/features/client/order/ClientActiveMap.tsx
          src/features/client/ui/ClientGlobalMenu.tsx
          src/mvp/AppLocationButton.tsx
          src/mvp/uiEvents.ts
          src/mvp/ProviderLocationTracker.tsx
          src/mvp/provider/ProviderRoot.tsx
          src/mvp/provider/ProviderHome.tsx
          src/mvp/provider/ProviderDemand.tsx
          src/mvp/provider/ProviderDemandMap.tsx
          src/mvp/provider/ProviderOpportunities.tsx
          src/mvp/provider/ProviderActiveJob.tsx
          src/mvp/provider/ProviderEvidencePanel.tsx
          src/mvp/provider/providerService.ts
          src/mvp/provider/useProviderRealtime.ts

      - name: Lint canonical Client migration surfaces with registered refactor debt
        run: >-
          npx eslint
          src/features/client/request/ClientNeedScreen.tsx
          src/features/client/request/ClientLocationScreen.tsx
          src/features/client/request/ClientWhenScreen.tsx
          src/features/client/payments/ClientPaymentScreen.tsx
          src/features/client/request/ClientSummaryScreen.tsx
          src/features/client/request/ClientPostConfirmFlow.tsx
          src/features/client/order/ClientServiceDetail.tsx
          src/features/client/order/ClientEvidenceGallery.tsx
          src/lib/browserVoiceBridge.ts
          --rule 'react-hooks/set-state-in-effect: off'
          --rule 'react-hooks/preserve-manual-memoization: off'
          --rule 'react-hooks/purity: off'
          --rule 'no-empty: off'
          --rule '@typescript-eslint/no-explicit-any: off'

      - name: Full repository lint gate
        run: npm run lint
