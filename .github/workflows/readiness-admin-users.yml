name: UGO Readiness Admin Users TEST
on:
  push:
    branches: [main]
    paths:
      - 'src/mvp/AdminUserTracePanel.tsx'
      - 'tests/contracts/readiness-admin-users.test.mjs'
      - 'scripts/readiness-admin-users-*.mjs'
      - '.github/workflows/readiness-admin-users.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ugo-readiness-admin-users-test
  cancel-in-progress: false
env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
  UGO_TEST_ADMIN_EMAIL: admin.ugo.test@example.com
  UGO_TEST_ADMIN_PASSWORD: ${{ secrets.UGO_TEST_ADMIN_PASSWORD }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify:test-env
      - run: node --test tests/contracts/readiness-admin-users.test.mjs tests/contracts/admin-complete-trace.test.mjs
      - run: npx tsc -b
      - run: node scripts/readiness-admin-users-runtime.mjs
      - run: node scripts/readiness-admin-users-judge.mjs
      - run: node scripts/readiness-admin-users-sentinel.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-admin-users-${{ github.sha }}
          path: artifacts/readiness-admin-users/*.json
          if-no-files-found: error
          retention-days: 90
