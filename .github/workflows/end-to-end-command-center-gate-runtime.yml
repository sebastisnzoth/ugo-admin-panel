name: UGO End-to-End Command Center Gate TEST

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/end-to-end-command-center-gate-*.mjs'
      - 'docs/UGO_FUNCTIONAL_READINESS.json'
      - 'docs/ugo-work-locks/readiness-*.json'
      - '.github/workflows/end-to-end-command-center-gate-runtime.yml'

permissions:
  contents: read

concurrency:
  group: ugo-end-to-end-command-center-gate-${{ github.sha }}
  cancel-in-progress: false

env:
  UGO_RUNTIME_SHA: ${{ github.sha }}

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Build exact SHA
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Evaluate autonomous completeness
        run: node scripts/end-to-end-command-center-gate-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: end-to-end-command-center-gate-runtime-${{ github.sha }}
          path: artifacts/end-to-end-command-center-gate-runtime.json
          if-no-files-found: error
          retention-days: 90

  judge:
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: end-to-end-command-center-gate-runtime-${{ github.sha }}
          path: artifacts
      - name: Judge
        run: node scripts/end-to-end-command-center-gate-judge.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: end-to-end-command-center-gate-judge-${{ github.sha }}
          path: artifacts/end-to-end-command-center-gate-judge.json
          retention-days: 90

  sentinel:
    needs: judge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: end-to-end-command-center-gate-runtime-${{ github.sha }}
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: end-to-end-command-center-gate-judge-${{ github.sha }}
          path: artifacts
      - name: Sentinel
        run: node scripts/end-to-end-command-center-gate-sentinel.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: end-to-end-command-center-gate-sentinel-${{ github.sha }}
          path: artifacts/end-to-end-command-center-gate-sentinel.json
          retention-days: 90
