name: Deploy UGO to WordPress
# Triggered after FTP secrets were configured.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wordpress/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/wordpress-deploy.yml"
  workflow_dispatch:

concurrency:
  group: ugo-wordpress-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  wordpress:
    name: Build and publish WordPress app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Check FTP configuration
        id: ftp
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.UGO_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.UGO_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.UGO_FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "WordPress FTP deployment is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UGO WordPress deploy skipped: configure UGO_FTP_SERVER, UGO_FTP_USERNAME and UGO_FTP_PASSWORD in GitHub Actions secrets."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b

      - name: Build portable WordPress bundle
        run: npx vite build --base=./

      - name: Verify build
        shell: bash
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Build ready:"
          du -sh dist

      - name: Create GitHub pull package metadata
        shell: bash
        run: |
          mkdir -p release
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > dist/ugo-build-manifest.json <<EOF
          {
            "schema": 1,
            "repo": "${GITHUB_REPOSITORY}",
            "branch": "main",
            "commit": "${GITHUB_SHA}",
            "short_commit": "${GITHUB_SHA::12}",
            "built_at": "${BUILT_AT}",
            "build_file": "ugo-wordpress-build.zip"
          }
          EOF
          cp dist/ugo-build-manifest.json release/ugo-build-manifest.json
          (cd dist && zip -qr ../release/ugo-wordpress-build.zip .)
          sha256sum release/ugo-wordpress-build.zip > release/ugo-wordpress-build.zip.sha256

      - name: Publish GitHub package for WordPress updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view wordpress-latest >/dev/null 2>&1; then
            gh release upload wordpress-latest \
              release/ugo-build-manifest.json \
              release/ugo-wordpress-build.zip \
              release/ugo-wordpress-build.zip.sha256 \
              --clobber
            gh release edit wordpress-latest \
              --title "UGO WordPress · latest" \
              --notes "Build automático de main: ${GITHUB_SHA}"
          else
            gh release create wordpress-latest \
              release/ugo-build-manifest.json \
              release/ugo-wordpress-build.zip \
              release/ugo-wordpress-build.zip.sha256 \
              --target "${GITHUB_SHA}" \
              --title "UGO WordPress · latest" \
              --notes "Build automático de main: ${GITHUB_SHA}"
          fi

      - name: Publish build to WordPress over FTP
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.UGO_FTP_SERVER }}
          username: ${{ secrets.UGO_FTP_USERNAME }}
          password: ${{ secrets.UGO_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: /htdocs/wp-content/uploads/ugo-app-build/current/
          timeout: 120000

      - name: Publish WordPress landing bridge
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.UGO_FTP_SERVER }}
          username: ${{ secrets.UGO_FTP_USERNAME }}
          password: ${{ secrets.UGO_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wordpress/mu-plugins/
          server-dir: /htdocs/wp-content/mu-plugins/
          timeout: 120000

      - name: Deployment summary
        shell: bash
        run: |
          if [ "${{ steps.ftp.outputs.ready }}" = "true" ]; then
            echo "### UGO → WordPress" >> "$GITHUB_STEP_SUMMARY"
            echo "Build published to the WordPress UGO build directory." >> "$GITHUB_STEP_SUMMARY"
            echo "Open: https://ugoapp.infy.click/ugo-cliente/?app=client" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### UGO → WordPress" >> "$GITHUB_STEP_SUMMARY"
            echo "Build + GitHub pull package published. FTP mirror is waiting for the three UGO_FTP_* repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
