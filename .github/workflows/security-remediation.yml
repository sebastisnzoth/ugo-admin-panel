name: UGO Dependency Remediation

on:
  push:
    branches:
      - security/p0-dependency-audit-20260911

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/p0-dependency-audit-20260911

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install remediated dependencies
        run: npm ci

      - name: Normalize CSV BOM handling
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/components/AdvancedSections.tsx')
          text = path.read_text()
          text = text.replace(r"replace(/^\\uFEFF/, '')", r"replace(/^\uFEFF/, '')")
          path.write_text(text)
          PY

      - name: Verify production build
        run: npm run build

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Verify critical lint surfaces
        run: >-
          npx eslint
          src/mvp/MvpApp.tsx
          src/mvp/client/ClientRoot.tsx
          src/mvp/NotificationCenter.tsx
          src/mvp/PaymentTimeline.tsx
          src/mvp/ClientLiveTracking.tsx
          src/mvp/ClientActiveMap.tsx
          src/mvp/ClientGlobalMenu.tsx
          src/mvp/AppLocationButton.tsx
          src/mvp/VoiceHugoDock.tsx
          src/mvp/uiEvents.ts
          src/mvp/ProviderLocationTracker.tsx
          src/mvp/provider/ProviderRoot.tsx
          src/mvp/provider/ProviderActiveJob.tsx

      - name: Commit source normalization
        run: |
          if git diff --quiet -- src/; then
            echo "No source normalization needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/
          git commit -m "security: normalize secure CSV import"
          git push origin HEAD:security/p0-dependency-audit-20260911
