name: UGO Exception Recovery TEST

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260929190746_autonomous_exception_recovery_runtime.sql'
      - 'scripts/autonomous-exception-recovery-runtime.mjs'
      - 'scripts/autonomous-exception-recovery-judge.mjs'
      - 'tests/contracts/autonomous-exception-recovery.test.mjs'
      - 'docs/readiness/auto-recovery-playbooks.md'
      - '.github/workflows/ugo-exception-recovery-test.yml'

concurrency:
  group: ugo-exception-recovery-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  exception-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
      UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Contract
        run: node --test tests/contracts/autonomous-exception-recovery.test.mjs
      - name: Execute recoverable exception through UGO runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autonomous-exception-recovery-runtime.mjs | tee /tmp/ugo-auto-recovery-runtime.json
      - name: Independent Judge and Sentinel
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autonomous-exception-recovery-judge.mjs | tee /tmp/ugo-auto-recovery-verdict.json
      - name: Persist runtime proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugo-auto-recovery-proof-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/ugo-auto-recovery-runtime.json
            /tmp/ugo-auto-recovery-verdict.json
