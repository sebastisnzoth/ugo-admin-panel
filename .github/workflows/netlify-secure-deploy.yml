name: Netlify secure deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-secure-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate one-time deploy keypair
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:8192 -out /tmp/netlify-deploy-private.pem
          openssl pkey -in /tmp/netlify-deploy-private.pem -pubout -out /tmp/netlify-deploy-public.pem

      - name: Publish one-time public key
        uses: actions/upload-artifact@v4
        with:
          name: netlify-deploy-public-key
          path: /tmp/netlify-deploy-public.pem
          retention-days: 1
          if-no-files-found: error

      - name: Wait for encrypted Netlify authorization
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          target=".netlify-deploy/${RUN_ID}.enc.b64"
          found=0
          for i in $(seq 1 120); do
            git fetch -q origin main
            if git show "origin/main:${target}" > /tmp/netlify-proxy.enc.b64 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          if [ "$found" != "1" ]; then
            echo "Encrypted authorization was not delivered for run ${RUN_ID}." >&2
            exit 1
          fi
          base64 -d /tmp/netlify-proxy.enc.b64 > /tmp/netlify-proxy.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/netlify-deploy-private.pem \
            -in /tmp/netlify-proxy.enc \
            -pkeyopt rsa_padding_mode:oaep \
            > /tmp/netlify-proxy.txt
          test -s /tmp/netlify-proxy.txt

      - name: Deploy UGO TEST to Netlify
        env:
          SITE_ID: 4632bcb3-b387-42aa-8a02-069300afd951
        run: |
          set -euo pipefail
          PROXY_PATH="$(cat /tmp/netlify-proxy.txt)"
          echo "::add-mask::$PROXY_PATH"
          npx -y @netlify/mcp@latest --site-id "$SITE_ID" --proxy-path "$PROXY_PATH"
