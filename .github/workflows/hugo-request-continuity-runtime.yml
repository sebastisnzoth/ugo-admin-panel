name: UGO Hugo Request Continuity Runtime TEST

on:
  pull_request:
    paths:
      - 'src/features/client/hugo/ClientVoiceHugoDock.tsx'
      - 'src/lib/browserVoiceBridge.ts'
      - 'scripts/hugo-request-continuity-*.mjs'
      - 'tests/contracts/hugo-request-continuity-structured.test.mjs'
      - '.github/workflows/hugo-request-continuity-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
  UGO_TEST_CLIENT_EMAIL: cliente@ugo.com.ar
  UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - run: node --test tests/contracts/hugo-request-continuity-structured.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Runtime
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UGO_UI_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ugo-hugo-request-continuity-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$UGO_UI_BASE_URL/?app=client" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=client" >/dev/null
          node scripts/hugo-request-continuity-runtime.mjs
      - name: Judge
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/hugo-request-continuity-judge.mjs
      - name: Sentinel
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/hugo-request-continuity-sentinel.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hugo-request-continuity-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/hugo-request-continuity-*
          if-no-files-found: warn
          retention-days: 90
