name: UGO Readiness Auto Kill Switch TEST
# retrigger: attempt-2-20260930T1331Z

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260930014823_auto_killswitch_fail_closed_precedence.sql"
      - "src/mvp/SuperAdminCommandCenter.tsx"
      - "src/mvp/AutonomousCorporationDashboard.tsx"
      - "scripts/auto-killswitch-runtime.mjs"
      - "scripts/auto-killswitch-judge.mjs"
      - "scripts/auto-killswitch-sentinel.mjs"
      - ".github/workflows/auto-killswitch-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugo-readiness-auto-killswitch
  cancel-in-progress: true

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_ADMIN_EMAIL: admin.ugo.test@example.com
  UGO_TEST_ADMIN_PASSWORD: ${{ secrets.UGO_TEST_ADMIN_PASSWORD }}

jobs:
  runtime-proof:
    name: Kill switch stop ↔ recovery · UGO TEST · Judge · Sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse missing TEST credentials
        run: |
          set -euo pipefail
          test "$UGO_TEST_SUPABASE_URL" = "https://tmossnqfwfwjrtzwcbmm.supabase.co"
          test -n "$UGO_TEST_ADMIN_PASSWORD"
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - name: Build exact SHA
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute kill switch stop and recovery runtime
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="${GITHUB_SHA}"
          export VITE_APP_REVISION="${GITHUB_SHA}"
          export UGO_UI_BASE_URL="http://127.0.0.1:4173"
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ugo-auto-killswitch-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$UGO_UI_BASE_URL/?app=admin" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=admin" >/dev/null
          node scripts/auto-killswitch-runtime.mjs
      - name: Independent Judge
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/auto-killswitch-judge.mjs
      - name: Sentinel reconciliation
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/auto-killswitch-sentinel.mjs
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-killswitch-${{ github.sha }}
          path: artifacts/auto-killswitch-*
          if-no-files-found: warn
          retention-days: 90
