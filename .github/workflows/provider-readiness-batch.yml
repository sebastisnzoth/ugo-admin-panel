name: UGO Provider Readiness Batch TEST

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-readiness-batch.yml'
      - 'scripts/provider-ui-runtime.mjs'
      - 'scripts/autonomous-qa-gps-runtime.mjs'
      - 'scripts/provider-debt-runtime.mjs'
      - 'tests/contracts/provider-test-runtime-concurrency.test.mjs'

permissions:
  contents: read

concurrency:
  group: ugo-provider-readiness-batch
  cancel-in-progress: false

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
  UGO_TEST_PROVIDER_EMAIL: proveedor.ugo.test@example.com
  UGO_TEST_PROVIDER_PASSWORD: ${{ secrets.UGO_TEST_PROVIDER_PASSWORD }}
  UGO_RUNTIME_SHA: ${{ github.sha }}

jobs:
  provider-readiness:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Require UGO TEST credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UGO_TEST_PROVIDER_PASSWORD"
          test -n "$UGO_TEST_SUPABASE_SERVICE_ROLE_KEY"
      - name: Enforce UGO TEST
        run: npm run verify:test-env
      - name: Build exact SHA
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Contract gates
        run: |
          node --test tests/contracts/provider-arrival-gps-gate.test.mjs tests/contracts/provider-arrival-location.test.mjs
          node --test tests/contracts/provider-debt-acceptance-gate.test.mjs tests/contracts/provider-ugo-debt-limit.test.mjs tests/contracts/cash-provider-ugo-debt.test.mjs
          node --test tests/contracts/provider-test-runtime-concurrency.test.mjs
      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Provider responsive runtime
        id: responsive
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export UGO_UI_BASE_URL=http://127.0.0.1:4173
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/ugo-provider-batch-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$UGO_UI_BASE_URL/?app=provider" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=provider" >/dev/null
          node scripts/provider-ui-runtime.mjs
      - name: Provider GPS runtime
        id: gps
        continue-on-error: true
        run: node scripts/autonomous-qa-gps-runtime.mjs
      - name: Provider debt runtime
        id: debt
        continue-on-error: true
        run: node scripts/provider-debt-runtime.mjs
      - name: Enforce provider readiness outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.responsive.outcome }}" = success
          test "${{ steps.gps.outcome }}" = success
          test "${{ steps.debt.outcome }}" = success
      - name: Upload provider readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-readiness-batch-${{ github.sha }}
          path: artifacts/provider-*
          if-no-files-found: warn
          retention-days: 90
