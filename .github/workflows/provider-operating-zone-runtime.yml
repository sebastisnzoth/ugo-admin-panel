name: UGO Provider Operating Zone Runtime TEST

on:
  pull_request:
    paths:
      - 'src/mvp/provider/ProviderProfile.tsx'
      - 'src/mvp/provider/providerData.tsx'
      - 'supabase/migrations/20261001022000_provider_configurable_operating_radius.sql'
      - 'scripts/provider-operating-zone-*.mjs'
      - 'tests/contracts/provider-operating-zone.test.mjs'
      - '.github/workflows/provider-operating-zone-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # This runtime drives the fixed QA fixture through a Postgres advisory lock
  # (autonomous_qa_provider_operating_radius). Two branches running it at once
  # made the second waiter exceed the statement timeout (evidence 2026-10-20),
  # so serialize this workflow across ALL branches (group without a ref).
  group: ugo-provider-operating-zone-runtime
  cancel-in-progress: false

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - run: node --test tests/contracts/provider-operating-zone.test.mjs
      - name: Runtime
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          node scripts/provider-operating-zone-runtime.mjs 2>&1 | tee /tmp/ugo-provider-operating-zone-runtime.log
      - name: Runtime failure details
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/ugo-provider-operating-zone-runtime.log ]; then
            tail -n 10 /tmp/ugo-provider-operating-zone-runtime.log | while IFS= read -r line; do
              line="${line//%/%25}"
              line="${line//$'\r'/%0D}"
              printf '::error title=Provider Operating Zone failure::%s\n' "$line"
            done
          fi
      - name: Judge
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/provider-operating-zone-judge.mjs
      - name: Sentinel
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/provider-operating-zone-sentinel.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-operating-zone-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/provider-operating-zone-*
          if-no-files-found: warn
          retention-days: 90
