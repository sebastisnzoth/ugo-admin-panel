name: Netlify source package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Vite build
        run: npm run build

      - name: Package source
        uses: actions/upload-artifact@v4
        with:
          name: ugo-netlify-source
          path: |
            .
            !node_modules
            !.git
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
