name: UGO Proximity Matching Runtime TEST

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261001022000_provider_configurable_operating_radius.sql'
      - 'supabase/migrations/20261001024000_proximity_matching_runtime_qa.sql'
      - 'scripts/proximity-matching-*.mjs'
      - 'tests/contracts/proximity-matching-runtime.test.mjs'
      - '.github/workflows/proximity-matching-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - run: node --test tests/contracts/proximity-matching-runtime.test.mjs
      - name: Runtime
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/proximity-matching-runtime.mjs
      - name: Judge
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/proximity-matching-judge.mjs
      - name: Sentinel
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/proximity-matching-sentinel.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proximity-matching-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/proximity-matching-*
          if-no-files-found: warn
          retention-days: 90
