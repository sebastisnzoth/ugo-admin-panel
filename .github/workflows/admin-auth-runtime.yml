name: UGO Admin Auth Runtime TEST

on:
  push:
    branches: [main]
    paths:
      - "src/mvp/AdminGate.tsx"
      - "src/lib/supabase.ts"
      - "src/lib/supabaseProject.ts"
      - "scripts/admin-auth-runtime.mjs"
      - "scripts/admin-auth-judge.mjs"
      - "scripts/admin-auth-sentinel.mjs"
      - ".github/workflows/admin-auth-runtime.yml"
      - "supabase/migrations/20260916094000_usuarios_privilege_escalation_guard.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugo-test-arena-remote-runtime
  cancel-in-progress: false

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_CLIENT_EMAIL: cliente@ugo.com.ar
  UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}
  UGO_TEST_PROVIDER_EMAIL: proveedor.ugo.test@example.com
  UGO_TEST_PROVIDER_PASSWORD: ${{ secrets.UGO_TEST_PROVIDER_PASSWORD }}
  UGO_TEST_ADMIN_EMAIL: admin.ugo.test@example.com
  UGO_TEST_ADMIN_PASSWORD: ${{ secrets.UGO_TEST_ADMIN_PASSWORD }}

jobs:
  proof:
    name: Admin auth positive/negative + Judge + Sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse missing TEST credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$UGO_TEST_SUPABASE_URL" = "https://tmossnqfwfwjrtzwcbmm.supabase.co"
          test -n "$UGO_TEST_CLIENT_PASSWORD"
          test -n "$UGO_TEST_PROVIDER_PASSWORD"
          test -n "$UGO_TEST_ADMIN_PASSWORD"
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - name: Build exact SHA
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute dedicated Admin auth runtime
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="${GITHUB_SHA}"
          export VITE_APP_REVISION="${GITHUB_SHA}"
          export UGO_UI_BASE_URL="http://127.0.0.1:4173"
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ugo-admin-auth-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$UGO_UI_BASE_URL/?app=admin" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=admin" >/dev/null
          node scripts/admin-auth-runtime.mjs
          node scripts/admin-auth-judge.mjs
          node scripts/admin-auth-sentinel.mjs
      - name: Upload admin-auth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-auth-runtime-${{ github.sha }}
          path: artifacts/admin-auth-*.json
          if-no-files-found: error
          retention-days: 90
