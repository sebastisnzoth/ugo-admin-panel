name: UGO GitHub Pages

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "docs/UGO_AUTONOMOUS_CORPORATION_IMPLEMENTATION.md"
      - "docs/UGO_SCHEDULER_POLICY.json"
      - "docs/UGO_FUNCTIONAL_READINESS.json"
      - "docs/ugo-work-locks/**"
      - "scripts/generate-pages-status.mjs"
      - "scripts/ugo-scheduler-engine.mjs"
      - "scripts/ugo-readiness-engine.mjs"
      - "scripts/validate-ugo-scheduler.mjs"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "ugo-pages"
  # Never cancel an in-flight Pages deployment: cancellation during deploy can leave the next run waiting/failing.
  # Queue the newest publication instead; every run still publishes its exact SHA snapshot.
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish UGO Observatory
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate scheduler policy and locks
        shell: bash
        run: node scripts/validate-ugo-scheduler.mjs docs/UGO_SCHEDULER_POLICY.json docs/ugo-work-locks

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp -a pages/. _site/
          rm -f _site/status.json
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/generate-pages-status.mjs \
            docs/UGO_AUTONOMOUS_CORPORATION_IMPLEMENTATION.md \
            _site/status.json \
            "${GITHUB_SHA}" \
            "${PUBLISHED_AT}"
          sed -i "s/__UGO_SHA__/${GITHUB_SHA}/g" _site/index.html
          sed -i "s/__UGO_PUBLISHED_AT__/${PUBLISHED_AT}/g" _site/index.html

      - name: Build same-SHA CI snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=50" \
            > /tmp/ugo-runs.json
          jq '
            [.workflow_runs
              | group_by(.name)[]
              | map(select(.status == "completed"))
              | sort_by(.updated_at)
              | reverse
              | .[0]
              | select(. != null)
              | {
                  name,
                  status,
                  conclusion,
                  run_number,
                  head_sha,
                  updated_at,
                  html_url
                }
            ]
          ' /tmp/ugo-runs.json > _site/ci-status.json

      - name: Build GitHub activity snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=30" \
            > /tmp/ugo-activity-runs.json
          jq --arg generated_at "$GENERATED_AT" '{
            generated_at_utc: $generated_at,
            source: "GITHUB_ACTIONS_SERVER_SIDE",
            branch: "main",
            workflow_runs: [
              .workflow_runs[] |
              {
                id,
                name,
                status,
                conclusion,
                run_number,
                head_sha,
                event,
                created_at,
                updated_at,
                html_url,
                display_title
              }
            ]
          }' /tmp/ugo-activity-runs.json > _site/activity.json

      - name: Build open PR snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > /tmp/ugo-open-prs.json
          jq --arg generated_at "$GENERATED_AT" '{
            generated_at_utc: $generated_at,
            source: "GITHUB_PULL_REQUESTS_SERVER_SIDE",
            pull_requests: [
              .[] | {
                number,
                title,
                draft,
                html_url,
                updated_at,
                head_ref: .head.ref,
                head_sha: .head.sha,
                base_ref: .base.ref
              }
            ]
          }' /tmp/ugo-open-prs.json > _site/pull-requests.json

      - name: Build main HEAD snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            > /tmp/ugo-main-head.json
          jq --arg generated_at "$GENERATED_AT" '{
            generated_at_utc: $generated_at,
            source: "GITHUB_ACTIONS_SERVER_SIDE",
            branch: "main",
            sha: .sha,
            html_url: .html_url,
            committed_at: .commit.committer.date
          }' /tmp/ugo-main-head.json > _site/main-head.json

      - name: Verify public artifact is sanitized
        shell: bash
        run: |
          ! grep -R -E 'SUPABASE_SERVICE_ROLE|OPENROUTER_API_KEY|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
