name: UGO GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "docs/UGO_AUTONOMOUS_CORPORATION_IMPLEMENTATION.md"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ugo-pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish UGO Observatory
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp -a pages/. _site/
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i "s/__UGO_SHA__/${GITHUB_SHA}/g" _site/index.html _site/status.json
          sed -i "s/__UGO_PUBLISHED_AT__/${PUBLISHED_AT}/g" _site/index.html _site/status.json

      - name: Verify public artifact is sanitized
        shell: bash
        run: |
          ! grep -R -E 'SUPABASE_SERVICE_ROLE|OPENROUTER_API_KEY|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
