name: UGO GitHub Pages

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "ugo-pages"
  # Never cancel an in-flight Pages deployment: cancellation during deploy can leave the next run waiting/failing.
  # Queue the newest publication instead; every run still publishes its exact SHA snapshot.
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish UGO Observatory
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate scheduler policy and locks
        id: scheduler_validation
        continue-on-error: true
        shell: bash
        run: node scripts/validate-ugo-scheduler.mjs docs/UGO_SCHEDULER_POLICY.json docs/ugo-work-locks

      - name: Keep Command Center observable when lock schema is stale
        if: steps.scheduler_validation.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Scheduler lock validation is degraded. Publishing the Command Center anyway so stale/invalid locks remain visible and actionable; execution remains fail-closed."

      - name: Validate Command Center evidence synchronization contract
        shell: bash
        run: node --test tests/contracts/command-center-evidence-sync.test.mjs

      - name: Build same-SHA CI snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p _site
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=50" \
            > /tmp/ugo-runs.json
          jq '
            [.workflow_runs
              | group_by(.name)[]
              | map(select(.status == "completed"))
              | sort_by(.updated_at)
              | reverse
              | .[0]
              | select(. != null)
              | {
                  name,
                  status,
                  conclusion,
                  run_number,
                  head_sha,
                  updated_at,
                  html_url
                }
            ]
          ' /tmp/ugo-runs.json > _site/ci-status.json

      - name: Build GitHub activity snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=30" \
            > /tmp/ugo-activity-runs.json
          jq --arg generated_at "$GENERATED_AT" '{
            generated_at_utc: $generated_at,
            source: "GITHUB_ACTIONS_SERVER_SIDE",
            branch: "main",
            workflow_runs: [
              .workflow_runs[] |
              {
                id,
                name,
                status,
                conclusion,
                run_number,
                head_sha,
                event,
                created_at,
                updated_at,
                html_url,
                display_title
              }
            ]
          }' /tmp/ugo-activity-runs.json > _site/activity.json

      - name: Build open PR readiness snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p _site
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > /tmp/ugo-open-prs.json

          echo '{"pull_requests":[]}' > /tmp/ugo-readiness-prs.json
          jq -c '.[]' /tmp/ugo-open-prs.json | while read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            head_sha="$(jq -r '.head.sha' <<<"$pr")"
            head_ref="$(jq -r '.head.ref' <<<"$pr")"

            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${number}/files?per_page=100" \
              > "/tmp/ugo-pr-files-${number}.json"

            readiness_id=""
            evidence_status=""
            runtime_status=""
            judge=""
            sentinel=""
            evidence_path="$(jq -r '[.[] | select(.filename | test("^docs/evidence/.*\\.json$"))][0].filename // empty' "/tmp/ugo-pr-files-${number}.json")"

            if [ -n "$evidence_path" ]; then
              encoded_path="$evidence_path"
              if curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${encoded_path}?ref=${head_sha}" \
                > "/tmp/ugo-pr-evidence-${number}.json"; then
                jq -r '.content' "/tmp/ugo-pr-evidence-${number}.json" | tr -d '\n' | base64 -d > "/tmp/ugo-pr-evidence-decoded-${number}.json" || true
                if jq -e . "/tmp/ugo-pr-evidence-decoded-${number}.json" >/dev/null 2>&1; then
                  readiness_id="$(jq -r '.readiness_id // empty' "/tmp/ugo-pr-evidence-decoded-${number}.json")"
                  evidence_status="$(jq -r '.final_status // empty' "/tmp/ugo-pr-evidence-decoded-${number}.json")"
                  runtime_status="$(jq -r '.runtime_proof.status // empty' "/tmp/ugo-pr-evidence-decoded-${number}.json")"
                  judge="$(jq -r '.independent_validation.judge // empty' "/tmp/ugo-pr-evidence-decoded-${number}.json")"
                  sentinel="$(jq -r '.independent_validation.sentinel // empty' "/tmp/ugo-pr-evidence-decoded-${number}.json")"
                fi
              fi
            fi

            if [ -z "$readiness_id" ]; then
              readiness_id="$(sed -nE 's#^(fix|feat|chore)/([a-z0-9-]+)-readiness-.*#\2#p' <<<"$head_ref" | head -n1)"
            fi

            jq \
              --argjson pr "$pr" \
              --arg readiness_id "$readiness_id" \
              --arg evidence_status "$evidence_status" \
              --arg runtime_status "$runtime_status" \
              --arg judge "$judge" \
              --arg sentinel "$sentinel" \
              --arg evidence_path "$evidence_path" \
              '.pull_requests += [{
                number: $pr.number,
                title: $pr.title,
                draft: $pr.draft,
                html_url: $pr.html_url,
                updated_at: $pr.updated_at,
                head_ref: $pr.head.ref,
                head_sha: $pr.head.sha,
                base_ref: $pr.base.ref,
                readiness_id: $readiness_id,
                evidence_status: $evidence_status,
                runtime_status: $runtime_status,
                judge: $judge,
                sentinel: $sentinel,
                evidence_path: $evidence_path
              }]' /tmp/ugo-readiness-prs.json > /tmp/ugo-readiness-prs.next.json
            mv /tmp/ugo-readiness-prs.next.json /tmp/ugo-readiness-prs.json
          done

          jq --arg generated_at "$GENERATED_AT" '. + {
            generated_at_utc: $generated_at,
            source: "GITHUB_PULL_REQUESTS_SERVER_SIDE"
          }' /tmp/ugo-readiness-prs.json > _site/pull-requests.json

      - name: Setup Node for TEST app preview
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Provider GPS permission and freshness contracts
        shell: bash
        run: node --test tests/contracts/provider-live-gps-quality.test.mjs

      - name: Build UGO TEST app for GitHub Pages
        env:
          VITE_HUGO_EDGE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co/functions/v1/hugo-runtime
          VITE_APP_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          npm ci
          npm run build -- --base=/ugo-admin-panel/app/

      - name: Prepare static site
        shell: bash
        run: |
          cp -a pages/. _site/
          mkdir -p _site/app
          cp -a dist/. _site/app/
          rm -f _site/status.json
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/generate-pages-status.mjs \
            docs/UGO_AUTONOMOUS_CORPORATION_IMPLEMENTATION.md \
            _site/status.json \
            "${GITHUB_SHA}" \
            "${PUBLISHED_AT}" \
            _site/pull-requests.json
          sed -i "s/__UGO_SHA__/${GITHUB_SHA}/g" _site/index.html
          sed -i "s/__UGO_PUBLISHED_AT__/${PUBLISHED_AT}/g" _site/index.html

      - name: Build main HEAD snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            > /tmp/ugo-main-head.json
          jq --arg generated_at "$GENERATED_AT" '{
            generated_at_utc: $generated_at,
            source: "GITHUB_ACTIONS_SERVER_SIDE",
            branch: "main",
            sha: .sha,
            html_url: .html_url,
            committed_at: .commit.committer.date
          }' /tmp/ugo-main-head.json > _site/main-head.json

      - name: Verify public artifact is sanitized
        shell: bash
        run: |
          ! grep -R -E 'SUPABASE_SERVICE_ROLE|OPENROUTER_API_KEY|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for Pages artifact visibility
        shell: bash
        run: sleep 8

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
