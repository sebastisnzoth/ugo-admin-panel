name: UGO GitHub Pages

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "docs/UGO_AUTONOMOUS_CORPORATION_IMPLEMENTATION.md"
      - "docs/UGO_SCHEDULER_POLICY.json"
      - "docs/ugo-work-locks/**"
      - "scripts/generate-pages-status.mjs"
      - "scripts/ugo-scheduler-engine.mjs"
      - "scripts/validate-ugo-scheduler.mjs"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "ugo-pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish UGO Observatory
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate scheduler policy and locks
        shell: bash
        run: node scripts/validate-ugo-scheduler.mjs docs/UGO_SCHEDULER_POLICY.json docs/ugo-work-locks

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp -a pages/. _site/
          rm -f _site/status.json
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/generate-pages-status.mjs \
            docs/UGO_AUTONOMOUS_CORPORATION_IMPLEMENTATION.md \
            _site/status.json \
            "${GITHUB_SHA}" \
            "${PUBLISHED_AT}"
          sed -i "s/__UGO_SHA__/${GITHUB_SHA}/g" _site/index.html
          sed -i "s/__UGO_PUBLISHED_AT__/${PUBLISHED_AT}/g" _site/index.html

      - name: Build same-SHA CI snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=50" \
            > /tmp/ugo-runs.json
          jq '
            [.workflow_runs
              | group_by(.name)[]
              | map(select(.status == "completed"))
              | sort_by(.updated_at)
              | reverse
              | .[0]
              | select(. != null)
              | {
                  name,
                  status,
                  conclusion,
                  run_number,
                  head_sha,
                  updated_at,
                  html_url
                }
            ]
          ' /tmp/ugo-runs.json > _site/ci-status.json

      - name: Verify public artifact is sanitized
        shell: bash
        run: |
          ! grep -R -E 'SUPABASE_SERVICE_ROLE|OPENROUTER_API_KEY|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
