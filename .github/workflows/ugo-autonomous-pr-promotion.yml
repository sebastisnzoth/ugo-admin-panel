name: UGO Autonomous PR Promotion (gated)
on:
  workflow_run:
    workflows:
      - UGO Core CI
      - UGO P0 Client -> Provider Matching E2E TEST
      - UGO Cross Security Runtime TEST
      - UGO Cross-role UI Runtime TEST
      - UGO Roadmap Traceability
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
concurrency:
  group: ugo-autonomous-promotion
  cancel-in-progress: false
jobs:
  assess:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Verify exact SHA, all independent CI and safe scope before promotion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking SHA $CANDIDATE_SHA; one successful workflow is never enough."
          prs=$(gh api "repos/$REPO/pulls?state=open&per_page=100")
          pr=$(jq -r --arg sha "$CANDIDATE_SHA" '[.[]|select(.head.sha==$sha and (.head.ref|startswith("agent/ugo-cycle-")) and .base.ref=="main")]|first|.number // empty' <<<"$prs")
          if [ -z "$pr" ]; then echo "No eligible agent PR for this exact SHA."; exit 0; fi
          # A merge is never based on data from a previous commit or another PR.
          info=$(gh api "repos/$REPO/pulls/$pr")
          test "$(jq -r .head.sha <<<"$info")" = "$CANDIDATE_SHA"
          test "$(jq -r .base.ref <<<"$info")" = main
          test "$(jq -r .state <<<"$info")" = open
          # All required workflows MUST have finished successfully on the exact HEAD.
          required=(
            "UGO Core CI"
            "UGO P0 Client -> Provider Matching E2E TEST"
            "UGO Cross Security Runtime TEST"
            "UGO Cross-role UI Runtime TEST"
            "UGO Roadmap Traceability"
          )
          runs=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$CANDIDATE_SHA&per_page=100" --jq '.workflow_runs[] | {name,conclusion,status,head_sha,created_at,run_attempt}')
          for name in "${required[@]}"; do
            state=$(jq -sr --arg n "$name" --arg sha "$CANDIDATE_SHA" '[.[] | select(.name==$n and .head_sha==$sha)] | sort_by(.created_at,.run_attempt) | last | .conclusion // "missing"' <<<"$runs")
            echo "$name: $state"
            if [ "$state" != success ]; then
              echo "::notice::BLOCKED_PR_$pr: $name is $state on $CANDIDATE_SHA."
              exit 0
            fi
          done
          files=$(gh api --paginate "repos/$REPO/pulls/$pr/files?per_page=100" --jq '.[].filename')
          if [ -z "$files" ]; then echo "::error::No changed files"; exit 1; fi
          while IFS= read -r file; do
            case "$file" in
              src/mvp/provider/*|tests/contracts/provider-*|scripts/role-ui-runtime.mjs|docs/UGO_ROADMAP_MASTER.md|docs/UGO_CAMINO_MAESTRO.md) ;;
              *) echo "::notice::BLOCKED_PR_$pr: outside approved provider P0 scope: $file"; exit 0 ;;
            esac
          done <<<"$files"
          # A successful CI job alone is never authorization to merge.
          # Prove provider Online/Stable Auth/GPS/Realtime with a dedicated runtime
          # workflow, on precisely this source SHA. Missing is a hard hold.
          proof="UGO Provider Online GPS Realtime E2E TEST"
          proof_state=$(jq -sr --arg n "$proof" --arg sha "$CANDIDATE_SHA" '[.[] | select(.name==$n and .head_sha==$sha)] | sort_by(.created_at,.run_attempt) | last | .conclusion // "missing"' <<<"$runs")
          if [ "$proof_state" != success ]; then
            echo "::notice::BLOCKED_RUNTIME_PROOF: $proof is $proof_state on $CANDIDATE_SHA"
            exit 0
          fi
          if [ "$(jq -r .draft <<<"$info")" != false ]; then
            echo "::notice::BLOCKED_DRAFT: candidate must be ready for independent review"
            exit 0
          fi
          # Enforce independent review: only approvals by another actor,
          # and a subsequent change_requested overrides earlier approval.
          author=$(jq -r .user.login <<<"$info")
          reviews=$(gh api --paginate "repos/$REPO/pulls/$pr/reviews?per_page=100" --jq '.[] | {login:.user.login,state,submitted_at}')
          approval=$(jq -sr --arg author "$author" '[.[] | select(.login != $author)] | group_by(.login) | map(sort_by(.submitted_at)|last) | any(.state=="APPROVED")' <<<"$reviews")
          if [ "$approval" != true ]; then
            echo "::notice::BLOCKED_REVIEW: no current independent approval"
            exit 0
          fi
          if jq -sr -e --arg author "$author" '[.[]|select(.login != $author)]|group_by(.login)|map(sort_by(.submitted_at)|last)|any(.state=="CHANGES_REQUESTED")' <<<"$reviews" >/dev/null; then
            echo "::notice::BLOCKED_REVIEW: outstanding change request"
            exit 0
          fi
          # Re-fetch just before the atomic merge, including current base.
          latest=$(gh api "repos/$REPO/pulls/$pr")
          [ "$(jq -r .head.sha <<<"$latest")" = "$CANDIDATE_SHA" ] || { echo "::error::Head changed; refusing stale merge"; exit 1; }
          [ "$(jq -r .base.ref <<<"$latest")" = main ] || exit 1
          [ "$(jq -r .mergeable <<<"$latest")" = true ] || { echo "::notice::BLOCKED_MERGEABLE"; exit 0; }
          # Github performs branch protection enforcement; never bypass it.
          result=$(gh api -X PUT "repos/$REPO/pulls/$pr/merge" -f sha="$CANDIDATE_SHA" -f merge_method=merge)
          [ "$(jq -r .merged <<<"$result")" = true ] || { echo "::error::GitHub did not merge candidate"; exit 1; }
          merge_sha=$(jq -r .sha <<<"$result")
          verify=$(gh api "repos/$REPO/pulls/$pr")
          [ "$(jq -r .merged <<<"$verify")" = true ] || exit 1
          [ "$(jq -r .merge_commit_sha <<<"$verify")" = "$merge_sha" ] || exit 1
          echo "### PR #$pr merged: $merge_sha (exact candidate $CANDIDATE_SHA)" >> "$GITHUB_STEP_SUMMARY"
          # workflow_dispatch is explicitly allowed to chain under GITHUB_TOKEN.
          # Do not publish; this is only the next isolated coding cycle.
          gh workflow run ugo-persistent-coding-agent.yml --repo "$REPO" --ref main
          echo "Next coding cycle dispatched on main" >> "$GITHUB_STEP_SUMMARY"
