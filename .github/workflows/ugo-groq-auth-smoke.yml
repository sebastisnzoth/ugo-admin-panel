name: UGO Groq authenticated smoke (no writes)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  groq-smoke:
    if: ${{ github.event.pull_request.number == 546 || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR files without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python 3.11 for agent
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and verify Aider CLI without editing code
        run: |
          python -m pip install --disable-pip-version-check 'aider-chat==0.86.1' 'pytest>=8,<9'
          python -m aider --help > /dev/null
          python -m pytest --version
          echo 'PASS: Aider installation and CLI verified'
      - name: Verify isolated authenticated inference
        env:
          HIVE_TOKEN: ${{ secrets.UGO_CODING_AGENT_HIVE_TOKEN }}
          FREEAPI_KEY: ${{ secrets.UGO_CODING_AGENT_FREEAPI_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          hive=os.environ.get('HIVE_TOKEN','')
          key=os.environ.get('FREEAPI_KEY','')
          if not hive or not key:
              raise SystemExit('FAIL: missing one or both GitHub Actions secrets')
          body=json.dumps({'model':'openai/gpt-oss-120b','messages':[{'role':'user','content':'Respond with OK only'}],'max_tokens':16}).encode()
          req=urllib.request.Request('https://ugo-hive-freeapi.onrender.com/v1/chat/completions',data=body,headers={'Content-Type':'application/json','Authorization':'Bearer '+key,'x-hive-token':hive},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=90) as res:
                  data=json.load(res)
                  msg=((data.get('choices') or [{}])[0].get('message') or {}).get('content')
                  if res.status!=200 or not isinstance(msg,str) or not msg.strip():
                      raise SystemExit('FAIL: incomplete model completion')
                  print('PASS: authenticated Groq model completion received, HTTP 200')
          except urllib.error.HTTPError as e:
              raise SystemExit('FAIL: FreeLLMAPI HTTP '+str(e.code))
          except urllib.error.URLError:
              raise SystemExit('FAIL: FreeLLMAPI network connection')
          PY
      - name: Verify Aider edits and tests an isolated fixture
        env:
          UGO_HIVE_TOKEN: ${{ secrets.UGO_CODING_AGENT_HIVE_TOKEN }}
          UGO_FREEAPI_API_KEY: ${{ secrets.UGO_CODING_AGENT_FREEAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/ugo-agent-smoke"
          mkdir -p "$workspace"
          printf 'def add(a, b):\n    return a - b\n' > "$workspace/arithmetic.py"
          cat > "$workspace/test_arithmetic.py" <<'PY'
          from arithmetic import add
          def test_add():
              assert add(2, 3) == 5
          PY
          python -m pytest "$workspace/test_arithmetic.py" >/dev/null && {
            echo "::error::Fixture must fail before agent repair"
            exit 1
          }
          python scripts/ugo_freeapi_bridge.py &
          bridge_pid=$!
          trap 'kill "$bridge_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/18765) 2>/dev/null; then break; fi
            sleep .2
          done
          (
            cd "$workspace"
            OPENAI_API_KEY=local-ugo-agent \
            OPENAI_API_BASE=http://127.0.0.1:18765/v1 \
            AIDER_CHECK_UPDATE=false \
            python -m aider --model openai/openai/gpt-oss-120b \
              --no-check-update --yes-always --no-auto-commits --no-gitignore --no-show-model-warnings \
              --message 'Correct arithmetic.py so add(a,b) returns their sum. Do not change test_arithmetic.py.' arithmetic.py
          )
          python -m pytest "$workspace/test_arithmetic.py" -q
          echo 'PASS: Aider repaired the isolated fixture and the regression test passed'
      - name: Bounded real UGO code analysis and edit in disposable runner
        env:
          UGO_HIVE_TOKEN: ${{ secrets.UGO_CODING_AGENT_HIVE_TOKEN }}
          UGO_FREEAPI_API_KEY: ${{ secrets.UGO_CODING_AGENT_FREEAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # The earlier fixture establishes editing capability. This pass uses
          # actual UGO source but NEVER pushes, deploys or merges.
          files=$(git ls-files 'src/*' | grep -Ei 'provider.*(auth|session|realtime)|session.*provider' | grep -E '\.(ts|tsx)$' | head -2 || true)
          if [ -z "$files" ]; then
            echo "::notice::No tightly scoped provider-auth source selected. No speculative edits."
            exit 0
          fi
          echo "Selected bounded UGO provider source:"
          printf '%s\n' "$files"
          python scripts/ugo_freeapi_bridge.py &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if (echo >/dev/tcp/127.0.0.1/18765) 2>/dev/null; then break; fi
            sleep .2
          done
          OPENAI_API_KEY=local-ugo-agent \
          OPENAI_API_BASE=http://127.0.0.1:18765/v1 \
          AIDER_CHECK_UPDATE=false \
          timeout 300 python -m aider --model openai/openai/gpt-oss-120b \
            --no-check-update --yes-always --no-auto-commits --no-gitignore \
            --message 'Inspect these real UGO provider files for a concrete unexpected sign-out on Online/GPS or Realtime. Make a SMALL safe fix ONLY if the root cause is evident in these files. Otherwise do not modify code. Do not touch production, GitHub workflow, or secrets.' $files
          if git diff --quiet; then
            echo "No real UGO source edit; no unverified fix claimed"
            exit 0
          fi
          if git diff --name-only | grep -Ev '^src/.*\.(ts|tsx)$'; then
            echo "::error::Non-source modifications rejected"
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:p0
          echo "PASS: candidate real-source change passed P0 tests in disposable runner (not persisted)"
