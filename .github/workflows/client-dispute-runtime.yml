name: UGO Client Dispute Runtime TEST
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/client-dispute-runtime.yml"
      - "scripts/client-dispute-*.mjs"
      - "tests/contracts/client-dispute-readiness.test.mjs"
      - "src/features/client/order/ClientCompletionReview.tsx"
      - "src/features/client/order/ClientServiceDetail.tsx"
      - "src/mvp/DisputeDock.tsx"

permissions:
  contents: read

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - name: Refuse non-TEST environment
        shell: bash
        run: |
          set -euo pipefail
          test "$UGO_TEST_SUPABASE_URL" = "https://tmossnqfwfwjrtzwcbmm.supabase.co"
          test -n "$UGO_TEST_SUPABASE_SERVICE_ROLE_KEY"
      - name: Client dispute contract
        run: node --test tests/contracts/client-dispute-readiness.test.mjs
      - name: Generate masked ephemeral fixture credential
        run: |
          node --input-type=module <<'NODE'
          import {randomUUID} from "node:crypto";import {appendFileSync} from "node:fs"
          const password="UGO-"+randomUUID()+"-A9!"
          console.log("::add-mask::"+password)
          appendFileSync(process.env.GITHUB_ENV,"UGO_DISPUTE_FIXTURE_PASSWORD="+password+"\n")
          NODE
      - name: Complete client dispute in UGO TEST
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/client-dispute-runtime.mjs
      - name: Judge
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/client-dispute-judge.mjs
      - name: Clean isolated fixtures even after failure
        if: always()
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/client-dispute-cleanup.mjs
      - name: Sentinel
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/client-dispute-sentinel.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-client-dispute-${{ github.sha }}
          path: artifacts/client-dispute-*
          if-no-files-found: warn
          retention-days: 90
