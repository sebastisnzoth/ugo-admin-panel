name: UGO Autonomous Worker TEST
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID del Command Center'
        required: false
        default: 'worker-autonomy'
        type: string
      job_id:
        description: 'Job ID auditable'
        required: false
        default: 'UGO-WORKER-AUTONOMY'
        type: string
      reason:
        description: 'Motivo auditable de la ejecución'
        required: false
        default: 'Command Center direct GitHub action'
        type: string
  workflow_run:
    workflows: ["UGO Isolated RPC RLS"]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
concurrency:
  # Both workflows mutate the same designated UGO TEST provider fixture.
  # Serialize them across workflow boundaries to avoid false P0 conflicts.
  group: ugo-test-shared-provider-fixture
  cancel-in-progress: false
jobs:
  cycle:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record GitHub direct-action request
        shell: bash
        env:
          CTA_TASK_ID: ${{ github.event.inputs.task_id || 'worker-autonomy' }}
          CTA_JOB_ID: ${{ github.event.inputs.job_id || 'UGO-WORKER-AUTONOMY' }}
          CTA_REASON: ${{ github.event.inputs.reason || github.event_name }}
          CTA_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ugo-execution-audit"
          node <<'NODE'
          const fs = require('fs'), path = require('path')
          const out = path.join(process.env.RUNNER_TEMP, 'ugo-execution-audit', 'request.json')
          fs.writeFileSync(out, JSON.stringify({
            schema_version:'UGO_GITHUB_DIRECT_ACTION_V1',
            task_id:process.env.CTA_TASK_ID, job_id:process.env.CTA_JOB_ID, reason:process.env.CTA_REASON,
            requested_by:process.env.GITHUB_ACTOR, event_name:process.env.GITHUB_EVENT_NAME,
            workflow:process.env.GITHUB_WORKFLOW, run_id:process.env.GITHUB_RUN_ID,
            run_attempt:process.env.GITHUB_RUN_ATTEMPT, repository:process.env.GITHUB_REPOSITORY,
            source_sha:process.env.CTA_SOURCE_SHA, environment:'UGO TEST', production:'PROTECTED',
            started_at:new Date().toISOString()
          }, null, 2) + '\n')
          NODE
          {
            echo "## UGO GitHub Direct Action"
            echo "- task: `$CTA_TASK_ID`"
            echo "- job: `$CTA_JOB_ID`"
            echo "- source SHA: `$CTA_SOURCE_SHA`"
            echo "- actor: `$GITHUB_ACTOR`"
            echo "- channel: GitHub Actions / UGO TEST"
            echo "- production: PROTECTED"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: Enforce UGO TEST only
        env:
          UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
        run: node scripts/assert-test-environment.mjs
      - name: Validate Gemini-first model route with OpenRouter fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
          UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/openrouter-autonomy-probe.mjs
      - name: Reconcile zero-cost model routes
        env:
          UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
          UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/autonomous-model-route-runtime.mjs
      - name: Exercise controlled model fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
          UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/autonomous-model-fallback-runtime.mjs
      - name: Exercise Consultar Agente HTTP handler in UGO TEST
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
          UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
          UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
          UGO_TEST_ADMIN_EMAIL: admin.ugo.test@example.com
          UGO_TEST_ADMIN_PASSWORD: ${{ secrets.UGO_TEST_ADMIN_PASSWORD }}
