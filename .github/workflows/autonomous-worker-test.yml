        run: node scripts/autonomous-corporate-challenges-runtime.mjs
      - name: Verify final D14 corporate audit
        env:
          UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
          UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/autonomous-final-corporate-audit-runtime.mjs
      - name: Reconcile permanent regressions
        env:
          UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
          UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/autonomous-regression-agent-runtime.mjs
      - name: Verify authoritative Customer 1 Release Gate
