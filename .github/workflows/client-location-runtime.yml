name: UGO Readiness Client Location TEST

on:
  push:
    branches: [main]
    paths:
      - "src/features/client/request/ClientLocationScreen.tsx"
      - "src/features/client/request/clientLocationScreen.css"
      - "src/lib/clientGeocoding.ts"
      - "scripts/client-location-runtime.mjs"
      - "scripts/client-location-judge.mjs"
      - "scripts/client-location-sentinel.mjs"
      - "tests/contracts/client-location-*.test.mjs"
      - ".github/workflows/client-location-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugo-readiness-client-location-test
  cancel-in-progress: false

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_CLIENT_EMAIL: cliente.ugo.test@example.com
  UGO_TEST_CLIENT_PASSWORD: ${{ secrets.UGO_TEST_CLIENT_PASSWORD }}

jobs:
  runtime-proof:
    name: Client location · map · fail-closed · Judge · Sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse missing TEST credentials
        run: |
          set -euo pipefail
          test "$UGO_TEST_SUPABASE_URL" = "https://tmossnqfwfwjrtzwcbmm.supabase.co"
          test -n "$UGO_TEST_CLIENT_PASSWORD"
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - name: Build exact SHA
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute client location runtime proof
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="${GITHUB_SHA}"
          export VITE_APP_REVISION="${GITHUB_SHA}"
          export UGO_UI_BASE_URL="http://127.0.0.1:4173"
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ugo-client-location-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$UGO_UI_BASE_URL/?app=client" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=client" >/dev/null
          node scripts/client-location-runtime.mjs
      - name: Independent Judge
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/client-location-judge.mjs
      - name: Sentinel
        env:
          UGO_RUNTIME_SHA: ${{ github.sha }}
        run: node scripts/client-location-sentinel.mjs
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-location-runtime-${{ github.sha }}
          path: artifacts/client-location-*
          if-no-files-found: warn
          retention-days: 90
