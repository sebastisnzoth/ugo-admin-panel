name: UGO Hugo Provider Actions Runtime TEST
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hugo-provider-actions-runtime.yml'
  pull_request:
    paths:
      - 'src/mvp/provider/ProviderHugoBridge.tsx'
      - 'src/mvp/provider/providerData.tsx'
      - 'src/lib/browserVoiceBridge.ts'
      - 'scripts/hugo-provider-actions-*.mjs'
      - 'tests/contracts/hugo-provider-actions-runtime.test.mjs'
      - '.github/workflows/hugo-provider-actions-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  # Single-flight REPO-WIDE: createUser/GoTrue + the Hugo UI flow against the
  # shared UGO TEST project; parallel suites produced AuthRetryableFetchError
  # 504 (evidence 2026-10-20). Serialize across all branches.
  group: ugo-runtime-timing-singleflight-${{ github.workflow }}
  cancel-in-progress: false
env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - run: node --test tests/contracts/hugo-provider-actions-runtime.test.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Runtime
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UGO_UI_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/ugo-hugo-provider-actions-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$UGO_UI_BASE_URL/?app=provider" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=provider" >/dev/null
          set -o pipefail
          node scripts/hugo-provider-actions-runtime.mjs 2>&1 | tee /tmp/ugo-hugo-provider-actions-runtime.log
      - name: Runtime failure details
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/ugo-hugo-provider-actions-runtime.log ]; then
            tail -n 10 /tmp/ugo-hugo-provider-actions-runtime.log | while IFS= read -r line; do
              line="${line//%/%25}"
              line="${line//$'\r'/%0D}"
              printf '::error title=Hugo Provider Actions failure::%s\n' "$line"
            done
          fi
      - name: Judge
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/hugo-provider-actions-judge.mjs
      - name: Sentinel
        env:
          UGO_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/hugo-provider-actions-sentinel.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hugo-provider-actions-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/hugo-provider-actions-*
          if-no-files-found: warn
          retention-days: 90
