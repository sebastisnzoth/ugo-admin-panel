name: UGO Admin Realtime Runtime TEST

on:
  push:
    branches: [main]
    paths:
      - "scripts/admin-realtime-runtime.mjs"
      - "scripts/admin-realtime-judge.mjs"
      - "scripts/admin-realtime-sentinel.mjs"
      - "src/mvp/AdminPhase2.tsx"
      - "src/hooks/useAdminActiveServices.ts"
      - "src/hooks/useAdminData.ts"
      - "tests/contracts/admin-realtime-control-center.test.mjs"
      - ".github/workflows/admin-realtime-runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/admin-realtime-runtime.mjs"
      - "scripts/admin-realtime-judge.mjs"
      - "scripts/admin-realtime-sentinel.mjs"
      - "src/mvp/AdminPhase2.tsx"
      - "src/hooks/useAdminActiveServices.ts"
      - "src/hooks/useAdminData.ts"
      - "tests/contracts/admin-realtime-control-center.test.mjs"
      - ".github/workflows/admin-realtime-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugo-test-runtime-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  UGO_TEST_SUPABASE_URL: https://tmossnqfwfwjrtzwcbmm.supabase.co
  UGO_TEST_SUPABASE_ANON_KEY: sb_publishable_meCpkMt79S25M0nHgVv1aQ_V9AMPZEl
  UGO_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UGO_TEST_SUPABASE_SERVICE_ROLE_KEY }}
  UGO_TEST_ADMIN_EMAIL: admin.ugo.test@example.com
  UGO_TEST_ADMIN_PASSWORD: ${{ secrets.UGO_TEST_ADMIN_PASSWORD }}

jobs:
  runtime-proof:
    name: Admin estados operativos ↔ Realtime UGO TEST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse non-TEST environment
        shell: bash
        run: |
          set -euo pipefail
          test "$UGO_TEST_SUPABASE_URL" = "https://tmossnqfwfwjrtzwcbmm.supabase.co"
          test -n "$UGO_TEST_SUPABASE_SERVICE_ROLE_KEY"
          test -n "$UGO_TEST_ADMIN_PASSWORD"
      - run: npm ci --include=dev
      - run: npm run verify:test-env
      - name: TypeScript and build
        env:
          VITE_APP_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build
      - name: Admin realtime regression contracts
        run: node --test tests/contracts/admin-realtime-control-center.test.mjs
      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Runtime TEST without refresh
        shell: bash
        run: |
          set -euo pipefail
          export UGO_RUNTIME_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          export VITE_APP_REVISION="${{ github.event.pull_request.head.sha || github.sha }}"
          export UGO_UI_BASE_URL="http://127.0.0.1:4173"
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/ugo-admin-realtime-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$UGO_UI_BASE_URL/?app=admin" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$UGO_UI_BASE_URL/?app=admin" >/dev/null
          node scripts/admin-realtime-runtime.mjs
      - name: Judge
        run: node scripts/admin-realtime-judge.mjs
      - name: Sentinel
        run: node scripts/admin-realtime-sentinel.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-realtime-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/admin-realtime-*
          if-no-files-found: warn
          retention-days: 90
