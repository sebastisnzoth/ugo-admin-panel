name: UGO Hive Independence Guard TEST

# Executable isolation gate: proves UGO Arena does not depend on UGO Hive and that
# the Hive modules keep their bounds. No secrets, no database, no deployment.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/mvp/HiveConsole.tsx'
      - 'src/mvp/hiveCatalog.ts'
      - 'src/mvp/hive-console.css'
      - 'scripts/hive/**'
      - 'hive/**'
      - 'tests/hive/**'
      - 'tests/contracts/hive-*.test.mjs'
      - 'tests/contracts/ugo-hive-*.test.mjs'
      - 'supabase/functions/ugo-hive-*/**'
      - 'supabase/migrations/*hive*'
      - '.github/workflows/hive-independence-guard.yml'

permissions:
  contents: read

concurrency:
  group: hive-independence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Static isolation + Hive contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Refuse any production target
        run: node scripts/assert-test-environment.mjs
      - name: Hive ⇄ Arena isolation audit
        run: node scripts/hive/isolation-audit.mjs --out artifacts/hive-isolation-audit.json
      - name: Hive contracts, quota engine and isolation rules
        run: |
          node --test --test-concurrency=1 \
            tests/hive/*.test.mjs \
            tests/contracts/hive-superadmin-console.test.mjs \
            tests/contracts/ugo-hive-model-router.test.mjs
      - name: Keep the isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-isolation-audit-${{ github.sha }}
          path: artifacts/hive-isolation-audit.json
          retention-days: 30
          if-no-files-found: error
