name: Netlify deploy (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribí DEPLOY_NETLIFY para habilitar este deploy manual'
        required: true
        default: 'NO'
        type: string

permissions:
  contents: read

concurrency:
  group: netlify-main-production
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: 4632bcb3-b387-42aa-8a02-069300afd951
  NETLIFY_TEST_URL: https://ugo-admin-panel-netlify.netlify.app

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY_NETLIFY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN || secrets.NETLIFY_ACCESS_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Detect Netlify credential
        id: netlify_auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Netlify deploy skipped: configure NETLIFY_AUTH_TOKEN, NETLIFY_TOKEN or NETLIFY_ACCESS_TOKEN in GitHub Actions secrets."
          fi

      - name: Install dependencies
        if: steps.netlify_auth.outputs.available == 'true'
        run: npm ci

      - name: TypeScript and production build
        if: steps.netlify_auth.outputs.available == 'true'
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build

      - name: Deploy main to existing Netlify TEST site
        if: steps.netlify_auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="main $GITHUB_SHA"

      - name: Smoke static surfaces
        if: steps.netlify_auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for path in / '/?app=client' '/?app=provider'; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' "$NETLIFY_TEST_URL$path")"
            echo "$path -> $code"
            test "$code" = '200'
          done

      - name: Smoke API adapter
        if: steps.netlify_auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="$NETLIFY_TEST_URL/api/admin/integrations-status"
          code="$(curl -sS -o /tmp/api.json -w '%{http_code}' "$url")"
          echo "/api/admin/integrations-status -> $code"
          cat /tmp/api.json
          test "$code" != '404'
          test "$code" != '301'
          test "$code" != '302'
          grep -Eq '^\{.*\}$' /tmp/api.json

      - name: Record blocked deployment
        if: steps.netlify_auth.outputs.available != 'true'
        shell: bash
        run: |
          {
            echo '### Netlify deploy blocked'
            echo
            echo 'GitHub Actions has no Netlify deploy token configured.'
            echo 'No deployment was attempted and Vercel was not used.'
          } >> "$GITHUB_STEP_SUMMARY"
