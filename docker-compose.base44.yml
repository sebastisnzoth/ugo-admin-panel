services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - VITE_APP_REVISION=base44-dev
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
