<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UGO — Demo de marketplace</title>
<style>
:root{--ink:#19251f;--muted:#738078;--line:#e5ebe6;--bg:#f6f8f6;--green:#176b4d;--mint:#e5f4ec;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column;gap:27px}.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:850;letter-spacing:-1px;padding:0 10px}.mark{width:32px;height:32px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center}.eyebrow{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#96a19a;font-weight:800;padding:0 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#66736b;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:var(--mint);color:var(--green);font-weight:750}.ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:17px 10px 0;color:var(--muted);font-size:12px}.tag{display:inline-block;background:#eff3ef;border-radius:6px;padding:4px 7px;font-size:10px;font-weight:800;letter-spacing:.6px}.main{min-width:0}.topbar{height:70px;background:#ffffffed;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:12px;position:sticky;top:0;z-index:3}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink)}.top-right{display:flex;align-items:center;gap:12px}.role-switch{display:flex;background:#f0f3f0;padding:4px;border-radius:10px;gap:3px}.role-switch button{border:0;background:transparent;color:#69756e;padding:7px 10px;border-radius:7px;font-size:11px;font-weight:750}.role-switch button.active{background:white;color:var(--green);box-shadow:0 1px 4px #0001}.avatar{width:34px;height:34px;background:#e8eee9;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--green)}.content{max-width:1250px;margin:auto;padding:30px}.welcome{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:23px}.kicker{font-size:10px;color:var(--green);font-weight:850;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:7px}h1{font-size:clamp(26px,3vw,35px);letter-spacing:-1.4px;line-height:1.15;margin:0 0 8px}h2{font-size:17px;letter-spacing:-.4px;margin:0}h3{font-size:13px;margin:0}p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-weight:700;color:var(--ink);font-size:12px}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn:hover{filter:brightness(.97)}.hero{background:var(--green);border-radius:17px;color:white;padding:27px;display:grid;grid-template-columns:1.15fr .85fr;gap:15px;align-items:center;overflow:hidden;margin-bottom:22px}.hero h2{font-size:clamp(23px,3vw,32px);line-height:1.15;letter-spacing:-1px;max-width:430px;margin:7px 0 10px}.hero p{color:#d4e8dc;max-width:430px}.hero .kicker{color:#b7e5cb}.search{display:flex;gap:8px;background:#fff;padding:6px;border-radius:10px;margin-top:19px;max-width:560px}.search input{border:0;outline:0;min-width:0;flex:1;padding:8px;color:var(--ink)}.hero-art{display:flex;justify-content:center;align-items:center;min-height:160px}.orbit{width:190px;height:190px;border:1px solid #ffffff30;border-radius:50%;display:grid;place-items:center;position:relative}.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid #ffffff22;border-radius:50%;inset:22px}.orbit:after{inset:47px}.house{width:84px;height:84px;border-radius:25px;background:#d6f0df;color:var(--green);display:grid;place-items:center;font-size:40px;transform:rotate(-7deg);z-index:1}.float{position:absolute;background:white;color:var(--ink);border-radius:10px;padding:8px 10px;font-size:10px;box-shadow:0 10px 30px #002b1b30;font-weight:750}.float.one{top:20px;left:-7px}.float.two{right:-8px;bottom:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}.stat,.panel,.service-card{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 25px #173c2b08}.stat{padding:16px 17px}.stat-label{font-size:11px;color:var(--muted);margin-bottom:6px}.stat-value{font-size:25px;font-weight:820;letter-spacing:-1px}.stat-foot{font-size:10px;color:var(--green);margin-top:4px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 13px}.section-head p{font-size:11px;margin-top:3px}.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}.category{border:1px solid var(--line);border-radius:12px;padding:15px 8px;background:#fff;text-align:center;transition:.15s}.category:hover,.category.selected{border-color:#8dbba3;background:#f1faf4}.cat-icon{width:41px;height:41px;margin:0 auto 8px;border-radius:12px;display:grid;place-items:center;background:#eef5f0;font-size:21px}.category strong{display:block;font-size:11px}.category span{font-size:10px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.service-card{overflow:hidden}.service-art{height:105px;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,#e9f3eb,#d8e8dd);position:relative}.service-art.blue{background:linear-gradient(135deg,#e8eef7,#d5e2f1)}.service-art.gold{background:linear-gradient(135deg,#f8f0df,#eadfc6)}.service-art.pink{background:linear-gradient(135deg,#f8e9e5,#efd6cf)}.service-art .pill{position:absolute;left:10px;top:10px}.pill{display:inline-flex;border-radius:5px;padding:4px 7px;background:#e5f4ec;color:var(--green);font-size:9px;font-weight:800}.pill.gray{background:#f0f2f0;color:#68746c}.pill.amber{background:#f5ead2;color:#88661b}.service-body{padding:13px}.service-body p{font-size:11px;margin:4px 0 11px}.service-meta{display:flex;justify-content:space-between;align-items:center;gap:7px;font-size:11px}.price{font-size:15px;font-weight:850}.rating{color:#8c6a18;font-weight:750}.provider-row{display:flex;align-items:center;gap:8px;margin:10px 0}.mini-avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#e9efeb;color:var(--green);font-size:10px;font-weight:800}.provider-row strong{font-size:11px;display:block}.provider-row small{font-size:10px;color:var(--muted)}.panel{padding:18px}.two-col{display:grid;grid-template-columns:1.3fr .9fr;gap:14px}.list{display:grid}.list-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.row-icon{width:37px;height:37px;flex:none;border-radius:10px;background:#eff5f0;display:grid;place-items:center;font-size:17px}.grow{flex:1;min-width:0}.grow strong{font-size:12px;display:block}.grow small{font-size:10px;color:var(--muted);display:block}.money{font-weight:800;font-size:12px;white-space:nowrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px}.table th{text-align:left;color:var(--muted);font-weight:700;background:#fafbfa}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.table td:first-child{font-weight:700}.status{font-size:9px;font-weight:800;padding:5px 7px;border-radius:5px;display:inline-block;background:var(--mint);color:var(--green)}.status.pending{background:#f5ead2;color:#88661b}.status.blocked{background:#f8e6e3;color:#a04439}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{border:1px solid var(--line);background:white;border-radius:7px;padding:7px 9px;font-size:10px;color:#657168}.filters button.active{border-color:var(--green);color:var(--green);background:var(--mint);font-weight:800}.notice{background:#f3f8f4;border:1px solid #dcebe0;padding:12px 14px;border-radius:10px;font-size:11px;color:#436452;margin-top:14px}.footnote{font-size:10px;color:#98a29b;margin-top:20px}.toast{position:fixed;right:20px;bottom:20px;background:#172b21;color:white;border-radius:11px;padding:12px 16px;box-shadow:0 10px 40px #0002;z-index:10;max-width:320px}.mobile-menu{display:none}
@media(max-width:900px){.shell{grid-template-columns:68px 1fr}.side{padding:20px 8px;align-items:center}.brand{padding:0;font-size:0}.brand .mark{flex:none}.eyebrow,.nav .label,.side-bottom{display:none}.nav button{justify-content:center;padding:12px 9px}.ico{width:auto}.content{padding:22px 18px}.topbar{padding:0 18px}.categories{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr .65fr}.two-col{grid-template-columns:1fr}}
@media(max-width:600px){.shell{display:block}.side{display:none}.topbar{height:auto;min-height:64px;padding:10px 13px;flex-wrap:wrap}.role-switch{order:3;width:100%;justify-content:space-between}.role-switch button{flex:1}.content{padding:19px 13px 35px}.hero{grid-template-columns:1fr;padding:22px}.hero-art{display:none}.welcome{flex-direction:column}.stats{gap:7px}.stat{padding:12px 10px}.stat-value{font-size:21px}.categories{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.service-art{height:120px}.top-right{margin-left:auto}.two-col{grid-template-columns:1fr}}
</style>
</head>
<body><div class="shell">
<aside class="side"><div class="brand"><span class="mark">u</span> UGO</div><div><div class="eyebrow">Workspace</div><nav class="nav" id="nav"></nav></div><div class="side-bottom"><span class="tag">DEMO INTERACTIVA</span><p style="margin-top:10px">Prototipo aislado · Datos ficticios</p></div></aside>
<main class="main"><header class="topbar"><div class="crumb">UGO / <strong id="crumb">Marketplace</strong></div><div class="top-right"><div class="role-switch" id="roles"><button data-role="client" class="active">Cliente</button><button data-role="provider">Proveedor</button><button data-role="admin">SuperAdmin</button></div><div class="avatar" id="avatar">M</div></div></header><div class="content" id="app"></div></main></div><div id="toast-root"></div>
<script>
const icons={home:"⌂",search:"⌕",bookings:"▤",inbox:"✉",calendar:"▦",wallet:"$",profile:"◉",overview:"▦",providers:"♙",services:"◇",users:"♧",audit:"≋",settings:"⚙"};
const state={role:"client",page:"home",category:"Todas",query:"",filter:"Todos",bookings:[{name:"Limpieza de hogar",provider:"Ana Ferreira",date:"Hoy · 15:30",price:120,status:"Confirmado"},{name:"Reparación de grifo",provider:"Carlos Mendes",date:"Mañana · 10:00",price:85,status:"Pendiente"}],approved:["Ana Ferreira","Carlos Mendes"],toastTimer:null};
const services=[
{title:"Limpieza de hogar",cat:"Limpieza",desc:"Un hogar impecable, sin complicaciones.",price:120,rating:"4.9",name:"Ana Ferreira",initials:"AF",icon:"🧹",bg:"",verified:true},
{title:"Electricista",cat:"Reparaciones",desc:"Instalaciones y arreglos con garantía.",price:95,rating:"4.8",name:"Carlos Mendes",initials:"CM",icon:"💡",bg:"blue",verified:true},
{title:"Plomería",cat:"Reparaciones",desc:"Soluciones rápidas para tu hogar.",price:85,rating:"4.9",name:"João Silva",initials:"JS",icon:"🔧",bg:"gold",verified:true},
{title:"Jardinería",cat:"Jardín",desc:"Cuidamos tus espacios verdes.",price:75,rating:"4.7",name:"Marina Costa",initials:"MC",icon:"🌿",bg:"",verified:true},
{title:"Pintura",cat:"Hogar",desc:"Renová tus ambientes con profesionales.",price:180,rating:"4.8",name:"Rafael Lima",initials:"RL",icon:"🖌️",bg:"pink",verified:true},
{title:"Armado de muebles",cat:"Hogar",desc:"Montaje prolijo y sin estrés.",price:65,rating:"4.8",name:"Lucas Rocha",initials:"LR",icon:"🪑",bg:"blue",verified:true}];
const categories=[["Todas","✦"],["Limpieza","🧹"],["Reparaciones","🔧"],["Jardín","🌿"],["Hogar","🏠"]];
function navItems(){return state.role==="client"?[["home","Inicio"],["discover","Explorar servicios"],["mybookings","Mis contrataciones"],["messages","Mensajes"],["profile","Mi perfil"]]:state.role==="provider"?[["overview","Resumen"],["jobs","Solicitudes"],["calendar","Agenda"],["earnings","Ingresos"],["profile","Perfil profesional"]]:[["overview","Resumen general"],["providers","Proveedores"],["servicesAdmin","Servicios"],["users","Usuarios"],["audit","Auditoría"]]}
function setPage(page){state.page=page;render()}
function toast(msg){const root=document.getElementById("toast-root");root.innerHTML='<div class="toast">'+msg+'</div>';clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>root.innerHTML="",2600)}
function money(n){return "$"+n.toLocaleString("es-AR")}
function head(k,title,sub,action=""){return '<div class="welcome"><div><div class="kicker">'+k+'</div><h1>'+title+'</h1><p>'+sub+'</p></div>'+(action?'<button class="btn primary" onclick="'+action+'">＋ Nueva solicitud</button>':"")+'</div>'}
function stat(label,value,foot){return '<div class="stat"><div class="stat-label">'+label+'</div><div class="stat-value">'+value+'</div><div class="stat-foot">'+foot+'</div></div>'}
function serviceCard(s){return '<article class="service-card"><div class="service-art '+s.bg+'"><span class="pill">✓ Verificado</span>'+s.icon+'</div><div class="service-body"><h3>'+s.title+'</h3><p>'+s.desc+'</p><div class="provider-row"><div class="mini-avatar">'+s.initials+'</div><div class="grow"><strong>'+s.name+'</strong><small>Proveedor verificado</small></div><span class="rating">★ '+s.rating+'</span></div><div class="service-meta"><div><span class="price">'+money(s.price)+'</span><span style="color:var(--muted)"> / visita</span></div><button class="btn small primary" onclick="bookService(\''+s.title+'\')">Solicitar</button></div></div></article>'}
function filteredServices(){return services.filter(s=>(state.category==="Todas"||s.cat===state.category)&&((s.title+" "+s.desc+" "+s.name+" "+s.cat).toLowerCase().includes(state.query.toLowerCase())))}
function browse(){const items=filteredServices();return head("Marketplace","Encontrá a la persona indicada.","Profesionales confiables para resolver lo que necesitás.")+'<div class="search" style="background:#fff;border:1px solid var(--line);margin:0 0 20px;max-width:none"><span style="padding:9px">⌕</span><input placeholder="¿Qué servicio estás buscando?" value="'+state.query.replace(/"/g,"&quot;")+'" oninput="state.query=this.value;renderContentOnly()"><button class="btn primary" onclick="render()">Buscar</button></div><div class="filters">'+categories.map(c=>'<button class="'+(state.category===c[0]?'active':'')+'" onclick="state.category=\''+c[0]+'\';render()">'+c[1]+' '+c[0]+'</button>').join("")+'</div><div class="section-head"><div><h2>Profesionales destacados</h2><p>'+items.length+' opciones disponibles · Valores ilustrativos</p></div></div><div class="cards">'+(items.length?items.map(serviceCard).join(""):'<div class="panel empty">No encontramos servicios con esos términos.</div>')+'</div>'}
function renderContentOnly(){const old=document.getElementById("cards");if(old)old.innerHTML=filteredServices().map(serviceCard).join("")}
function bookingRows(){return state.bookings.map((b,i)=>'<div class="list-row"><div class="row-icon">⌂</div><div class="grow"><strong>'+b.name+'</strong><small>'+b.provider+' · '+b.date+'</small></div><div style="text-align:right"><div class="money">'+money(b.price)+'</div><span class="status '+(b.status==="Pendiente"?"pending":"")+'">'+b.status+'</span></div></div>').join("")}
function clientHome(){return head("Tu espacio, más simple","Hola, Martina 👋","¿Qué necesitás resolver hoy?")+'<section class="hero"><div><div class="kicker">Tu hogar, en buenas manos</div><h2>Lo que necesitás.<br>Personas en quien confiar.</h2><p>Encontrá profesionales verificados y coordiná tus servicios en pocos pasos.</p><div class="search"><input id="hero-search" placeholder="Ej. limpieza, plomería, electricidad"><button class="btn primary" onclick="state.query=document.getElementById(\'hero-search\').value;setPage(\'discover\')">Buscar</button></div></div><div class="hero-art"><div class="orbit"><div class="house">⌂</div><div class="float one">✓ Profesionales verificados</div><div class="float two">★ 4.9 satisfacción</div></div></div></section><div class="stats">'+stat("Contrataciones activas",state.bookings.length,"Siempre al día")+stat("Servicios completados","12","+3 este mes")+stat("Profesionales favoritos","4","Guardados por vos")+'</div><div class="section-head"><div><h2>¿Qué servicio buscás?</h2><p>Explorá por categoría</p></div><button class="btn" onclick="setPage(\'discover\')">Ver todos →</button></div><div class="categories">'+categories.slice(1).map(c=>'<button class="category" onclick="state.category=\''+c[0]+'\';setPage(\'discover\')"><div class="cat-icon">'+c[1]+'</div><strong>'+c[0]+'</strong><span>Ver profesionales</span></button>').join("")+'<button class="category" onclick="state.category=\'Todas\';setPage(\'discover\')"><div class="cat-icon">✦</div><strong>Ver todo</strong><span>Todos los servicios</span></button></div><div class="section-head"><div><h2>Recomendados para vos</h2><p>Profesionales con buenas valoraciones</p></div><button class="btn" onclick="setPage(\'discover\')">Explorar →</button></div><div class="cards">'+services.slice(0,3).map(serviceCard).join("")+'</div><div class="section-head"><div><h2>Tus próximas contrataciones</h2><p>Consultá el estado de tus solicitudes</p></div><button class="btn" onclick="setPage(\'mybookings\')">Ver todas →</button></div><div class="panel list">'+bookingRows()+'</div>'}
function clientBookings(){return head("Tu actividad","Mis contrataciones","Revisá tus servicios y seguí cada solicitud.")+'<div class="panel"><div class="section-head" style="margin-top:0"><h2>Servicios recientes</h2><button class="btn primary" onclick="setPage(\'discover\')">＋ Contratar servicio</button></div><div class="list">'+bookingRows()+'</div></div><div class="notice">Este prototipo utiliza datos ficticios. Las solicitudes no se envían a proveedores reales.</div>'}
function providerHome(){return head("Panel profesional","Buen día, Ana 👋","Acá tenés el resumen de tu actividad.")+'<div class="stats">'+stat("Solicitudes nuevas","5","2 requieren respuesta")+stat("Trabajos esta semana","8","Agenda actualizada")+stat("Ingresos del mes",money(2840),"+12% vs. mes anterior")+'</div><div class="two-col"><section class="panel"><div class="section-head" style="margin-top:0"><div><h2>Solicitudes recientes</h2><p>Respondé para no perder oportunidades</p></div><button class="btn" onclick="setPage(\'jobs\')">Ver todas</button></div><div class="list">'+[['Limpieza profunda','Hoy · 15:30','120'],['Limpieza de apartamento','Mañana · 09:00','95'],['Limpieza semanal','Viernes · 11:00','80']].map((x,i)=>'<div class="list-row"><div class="row-icon">✦</div><div class="grow"><strong>'+x[0]+'</strong><small>'+x[1]+'</small></div><div style="text-align:right"><div class="money">$'+x[2]+'</div><button class="btn small" onclick="acceptJob('+i+')">Aceptar</button></div></div>').join("")+'</div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>Tu perfil</h2><span class="pill">Verificado</span></div><div class="provider-row"><div class="mini-avatar" style="width:45px;height:45px">AF</div><div class="grow"><strong>Ana Ferreira</strong><small>Limpieza del hogar · Florianópolis</small></div></div><div class="stat" style="box-shadow:none"><div class="stat-label">Valoración promedio</div><div class="stat-value">★ 4.9 <span style="font-size:12px;color:var(--muted);font-weight:500">/ 5.0</span></div><div class="stat-foot">Basada en 86 reseñas de ejemplo</div></div><div class="notice">Perfil completo al 92%. Agregá fotos de tus trabajos para mejorar tu visibilidad.</div></section></div>'}
function providerJobs(){return head("Oportunidades","Solicitudes de servicio","Gestioná las nuevas oportunidades de trabajo.")+'<div class="panel"><div class="filters"><button class="'+(state.filter==="Todos"?"active":"")+'" onclick="state.filter=\'Todos\';render()">Todas</button><button class="'+(state.filter==="Pendiente"?"active":"")+'" onclick="state.filter=\'Pendiente\';render()">Pendientes</button><button class="'+(state.filter==="Aceptado"?"active":"")+'" onclick="state.filter=\'Aceptado\';render()">Aceptadas</button></div><div class="list" style="margin-top:12px">'+[['Limpieza profunda','Hoy · 15:30','120','Pendiente'],['Limpieza de apartamento','Mañana · 09:00','95','Pendiente'],['Limpieza semanal','Viernes · 11:00','80','Aceptado'],['Limpieza de oficina','Lunes · 08:00','160','Pendiente']].filter(x=>state.filter==="Todos"||(state.filter==="Pendiente"&&x[3]==="Pendiente")||(state.filter==="Aceptado"&&x[3]==="Aceptado")).map((x,i)=>'<div class="list-row"><div class="row-icon">✦</div><div class="grow"><strong>'+x[0]+'</strong><small>'+x[1]+' · Cliente: Martina</small></div><div class="money">$'+x[2]+'</div>'+(x[3]==="Pendiente"?'<button class="btn small primary" onclick="acceptJob('+i+')">Aceptar</button>':'<span class="status">Aceptado</span>')+'</div>').join("")+'</div></div>'}
function providerSimple(page){const map={calendar:["Agenda","Tus próximos trabajos"],earnings:["Ingresos","Resumen de tu actividad económica"],profile:["Perfil profesional","Administrá la información que ven tus clientes"]};let m=map[page]||map.profile;return head("Tu negocio",m[0],m[1])+'<div class="stats">'+stat("Esta semana","8","Servicios programados")+stat("Este mes",money(2840),"Ingresos ilustrativos")+stat("Valoración","4.9 ★","86 reseñas ficticias")+'</div><div class="panel"><h2>'+m[0]+'</h2><p style="margin-top:6px">Vista de demostración. La conexión con calendario, pagos y perfil real debe integrarse después de revisar el proyecto.</p><div class="notice">Los datos de este panel son de ejemplo y no representan transacciones reales.</div></div>'}
function adminHome(){return head("Centro de operaciones","Estado de UGO","Supervisá la actividad y mantené la calidad de la plataforma.")+'<div class="stats">'+stat("Proveedores activos","248","+18 este mes")+stat("Pendientes de revisión","12","Requieren atención")+stat("Servicios publicados","536","En todas las categorías")+'</div><div class="two-col"><section class="panel"><div class="section-head" style="margin-top:0"><div><h2>Revisión de proveedores</h2><p>Solicitudes que requieren aprobación</p></div><button class="btn" onclick="setPage(\'providers\')">Ver cola →</button></div><div class="list">'+[['Lucas Pereira','Electricidad','Hace 18 min','LP'],['Marina Costa','Jardinería','Hace 1 h','MC'],['Rafael Lima','Pintura','Hace 3 h','RL']].map((x,i)=>'<div class="list-row"><div class="mini-avatar">'+x[3]+'</div><div class="grow"><strong>'+x[0]+'</strong><small>'+x[1]+' · '+x[2]+'</small></div><span class="status pending">Pendiente</span></div>').join("")+'</div></section><section class="panel"><h2>Actividad de la plataforma</h2><div class="list"><div class="list-row"><div class="row-icon">✓</div><div class="grow"><strong>Verificación completada</strong><small>Proveedor aprobado · hace 12 min</small></div></div><div class="list-row"><div class="row-icon">＋</div><div class="grow"><strong>Nuevo servicio publicado</strong><small>Jardinería · hace 40 min</small></div></div><div class="list-row"><div class="row-icon">⚑</div><div class="grow"><strong>Reporte recibido</strong><small>Revisión requerida · hace 1 h</small></div></div></div></section></div><div class="notice">Modo demo: las acciones de moderación solo actualizan esta vista local. No se alteran usuarios reales.</div>'}
function adminProviders(){let rows=[["Lucas Pereira","Electricidad","11 oct 2026","Pendiente"],["Marina Costa","Jardinería","11 oct 2026","Pendiente"],["Rafael Lima","Pintura","10 oct 2026","Pendiente"],["Ana Ferreira","Limpieza","02 oct 2026","Aprobado"],["Carlos Mendes","Reparaciones","01 oct 2026","Aprobado"]];return head("Control de calidad","Proveedores","Revisá perfiles y simulá decisiones de moderación.")+'<div class="panel"><div class="section-head" style="margin-top:0"><div><h2>Cola de aprobación</h2><p>Los cambios son locales a esta demo</p></div><span class="pill amber">3 pendientes</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Proveedor</th><th>Especialidad</th><th>Registro</th><th>Estado</th><th>Acción</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td><span class="status '+(state.approved.includes(r[0])?"": "pending")+'">'+(state.approved.includes(r[0])?"Aprobado":r[3])+'</span></td><td>'+(state.approved.includes(r[0])?'<button class="btn small" onclick="toast(\'El perfil ya figura aprobado en la demo.\')">Ver perfil</button>':'<button class="btn small primary" onclick="approve(\''+r[0]+'\')">Aprobar</button> <button class="btn small" onclick="reject(\''+r[0]+'\')">Rechazar</button>')+'</td></tr>').join("")+'</tbody></table></div><div class="notice">En producción, las aprobaciones deben validar permisos, guardar auditoría y ejecutar controles del backend. Esta demo no realiza esas operaciones.</div></div>'}
function adminTable(page){let title=page==="servicesAdmin"?"Servicios":"users",label=page==="servicesAdmin"?"Servicios publicados":"Usuarios";let rows=page==="servicesAdmin"?[["Limpieza de hogar","Hogar","Ana Ferreira","Activo"],["Electricista","Reparaciones","Carlos Mendes","Activo"],["Jardinería","Jardín","Marina Costa","En revisión"]]:[["Martina Oliveira","Cliente","Activo"],["Ana Ferreira","Proveedor","Activo"],["Lucas Pereira","Proveedor","En revisión"],["Equipo UGO","Administrador","Activo"]];return head("Administración",label,"Vista ilustrativa de gestión y moderación.")+'<div class="panel"><div class="section-head" style="margin-top:0"><h2>'+label+'</h2><button class="btn" onclick="toast(\'La creación real se habilitará tras conectar el backend.\')">＋ Nuevo</button></div><div class="table-wrap"><table class="table"><thead><tr>'+(page==="servicesAdmin"?'<th>Servicio</th><th>Categoría</th><th>Proveedor</th>':'<th>Nombre</th><th>Rol</th>')+'<th>Estado</th><th>Acción</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+r.slice(0,-1).map(c=>'<td>'+c+'</td>').join("")+'<td><span class="status '+(r[r.length-1]==="Activo"?"":"pending")+'">'+r[r.length-1]+'</span></td><td><button class="btn small" onclick="toast(\'Acción de ejemplo; no se modificó ningún registro real.\')">Detalles</button></td></tr>').join("")+'</tbody></table></div></div>'}
function audit(){return head("Transparencia","Registro de actividad","Ejemplo de eventos que el sistema debería auditar.")+'<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Evento</th><th>Actor</th><th>Fecha</th><th>Resultado</th></tr></thead><tbody>'+[['Proveedor aprobado','Admin UGO','11 oct · 14:42','Correcto'],['Servicio publicado','Ana Ferreira','11 oct · 13:18','Correcto'],['Inicio de sesión','Martina Oliveira','11 oct · 12:05','Correcto'],['Revisión solicitada','Sistema','11 oct · 11:40','Pendiente']].map(r=>'<tr>'+r.map((x,i)=>'<td>'+(i===3?'<span class="status '+(x==="Pendiente"?"pending":"")+'">'+x+'</span>':x)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div><div class="notice">Datos ficticios. La auditoría real debe ser persistente, protegida y no editable por usuarios ordinarios.</div></div>'}
function messages(){return head("Comunicación","Mensajes","Coordiná detalles de tus servicios.")+'<div class="panel"><div class="list">'+[['Ana Ferreira','Hola Martina, confirmo el horario de hoy.','10:32','AF'],['Carlos Mendes','¿Podrías compartir una foto del grifo?','Ayer','CM']].map(x=>'<div class="list-row"><div class="mini-avatar">'+x[3]+'</div><div class="grow"><strong>'+x[0]+'</strong><small>'+x[1]+'</small></div><small>'+x[2]+'</small><button class="btn small" onclick="toast(\'La mensajería real requiere conexión backend.\')">Abrir</button></div>').join("")+'</div></div>'}
function pageContent(){if(state.role==="client"){if(state.page==="home")return clientHome();if(state.page==="discover")return browse();if(state.page==="mybookings")return clientBookings();if(state.page==="messages")return messages();return providerSimple("profile")}if(state.role==="provider"){if(state.page==="overview")return providerHome();if(state.page==="jobs")return providerJobs();return providerSimple(state.page)}if(state.page==="overview")return adminHome();if(state.page==="providers")return adminProviders();if(state.page==="servicesAdmin"||state.page==="users")return adminTable(state.page);return audit()}
function render(){const nav=navItems();if(!nav.some(x=>x[0]===state.page))state.page=nav[0][0];document.getElementById("nav").innerHTML=nav.map(x=>'<button class="'+(state.page===x[0]?'active':'')+'" onclick="setPage(\''+x[0]+'\')"><span class="ico">'+(icons[x[0]]||"◇")+'</span><span class="label">'+x[1]+'</span></button>').join("");document.getElementById("app").innerHTML=pageContent()+'<div class="footnote">UGO · Demo de diseño aislada · Sin conexión a datos de producción</div>';document.getElementById("crumb").textContent=nav.find(x=>x[0]===state.page)?.[1]||"Workspace";document.getElementById("avatar").textContent=state.role==="client"?"M":state.role==="provider"?"A":"U";document.querySelectorAll("[data-role]").forEach(b=>b.classList.toggle("active",b.dataset.role===state.role))}
function setRole(role){state.role=role;state.page=role==="client"?"home":role==="provider"?"overview":"overview";state.category="Todas";state.query="";render()}
function bookService(title){state.bookings.unshift({name:title,provider:services.find(s=>s.title===title)?.name||"Proveedor UGO",date:"Solicitud recién creada",price:services.find(s=>s.title===title)?.price||100,status:"Pendiente"});toast("Solicitud de demo creada. No se envió a ningún proveedor.");setPage("mybookings")}
function acceptJob(i){toast("Solicitud aceptada en la demo. No se notificó a ningún cliente.");}
function approve(name){if(!state.approved.includes(name))state.approved.push(name);render();toast(name+" figura aprobado en la demo.")}
function reject(name){state.approved=state.approved.filter(x=>x!==name);toast("Rechazo simulado para "+name+". Sin cambios reales.");}
document.getElementById("roles").addEventListener("click",e=>{const b=e.target.closest("[data-role]");if(b)setRole(b.dataset.role)});render();
</script></body></html>
