<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UGO — Servicios On-Demand</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#f8f9ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UGO" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { min-height: 100%; }
      body { background: #f8f9ff; color: #0b1c30; overflow: hidden; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      h1,h2,h3,h4,h5,h6 { font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif; }
      .material-symbols-outlined { font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: "liga"; -webkit-font-smoothing: antialiased; }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Hugo Free Mode: AI sin API key del desarrollador. Puter usa una franquicia por usuario. -->
    <script src="https://js.puter.com/v2/"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ── U.GO OAuth Intercept v2 ─────────────────────────────────────────
      // Supabase redirige post-Google siempre a la raíz (/), porque
      // client.html y provider.html no están en su whitelist de redirects.
      // Este script intercepta ANTES que React monte, detecta el callback
      // OAuth y reenvía al destino correcto PRESERVANDO los params de URL.
      (function(){
        try {
          var dest = localStorage.getItem('ugo_oauth_dest');
          if (!dest) return;

          var qs = location.search;
          var hash = location.hash;
          var isOAuthCallback = (
            qs.includes('code=') ||
            qs.includes('error=') ||
            hash.includes('access_token')
          );

          if (!isOAuthCallback) return;
          localStorage.removeItem('ugo_oauth_dest');
          try { window.stop(); } catch(e) {}
          window.location.replace(dest + qs + hash);
        } catch(e) {
          try { localStorage.removeItem('ugo_oauth_dest'); } catch(_) {}
        }
      })();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function(){
          navigator.serviceWorker.register('/sw.js').catch(function(err){ console.warn('UGO service worker', err); });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
