<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.GO — Panel de Control</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #070a0d; overflow: hidden; }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Hugo Free Mode: AI sin API key del desarrollador. Puter usa una franquicia por usuario. -->
    <script src="https://js.puter.com/v2/"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ── U.GO OAuth Intercept v2 ─────────────────────────────────────────
      // Supabase redirige post-Google siempre a la raíz (/), porque
      // client.html y provider.html no están en su whitelist de redirects.
      // Este script intercepta ANTES que React monte, detecta el callback
      // OAuth y reenvía al destino correcto PRESERVANDO los params de URL.
      (function(){
        try {
          var dest = localStorage.getItem('ugo_oauth_dest');
          if (!dest) return;

          var qs = location.search;
          var hash = location.hash;
          var isOAuthCallback = (
            qs.includes('code=') ||
            qs.includes('error=') ||
            hash.includes('access_token')
          );

          if (!isOAuthCallback) return;
          localStorage.removeItem('ugo_oauth_dest');
          try { window.stop(); } catch(e) {}
          window.location.replace(dest + qs + hash);
        } catch(e) {
          try { localStorage.removeItem('ugo_oauth_dest'); } catch(_) {}
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
