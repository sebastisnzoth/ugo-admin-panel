<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGO · Prévia unificada</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&display=swap');
:root{font-family:'DM Sans',sans-serif;background:#f6f7f2;color:#20372c}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #b6d386;outline-offset:3px}h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-.045em}.wrap{max-width:1170px;margin:auto;padding:26px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font:800 32px Manrope;letter-spacing:-.1em}.logo span{color:#91af74}.pill{font-size:12px;font-weight:700;background:#edf1e7;border-radius:30px;padding:9px 14px;color:#5c755c}.nav{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}.nav button{border:1px solid #dde6d8;border-radius:15px;background:white;color:#53705d;font-weight:700;padding:12px 22px;flex:1}.nav button.active{background:#214d36;color:white;border-color:#214d36}.layout{display:grid;grid-template-columns:1.6fr .78fr;gap:20px}.main,.side{background:#fff;border:1px solid #e9eee7;border-radius:24px;padding:28px;box-shadow:0 9px 32px #183d2710}.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:#75936e}h1{font-size:clamp(30px,3.8vw,48px);line-height:1.13;max-width:570px;margin:13px 0}p{line-height:1.6;color:#6f7f72}.feature{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:186px;padding:24px;border-radius:20px;background:#e8f0df;margin:24px 0;overflow:hidden}.feature strong{font:800 22px Manrope;display:block;max-width:340px}.feature p{margin:8px 0 0;max-width:340px}.art{background:radial-gradient(circle at 35% 32%,#eaffcb,#a2c988 55%,#337550);width:112px;height:112px;border-radius:50%;box-shadow:0 0 0 16px #f8fcf58a,0 15px 28px #285a3d45;flex:none;display:grid;place-items:center;font-size:42px}.label{font-size:14px;font-weight:800;margin:23px 0 12px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{border:1px solid #e3e9dd;background:#fafbf8;border-radius:16px;padding:17px;min-height:140px;text-align:left;color:inherit;transition:.15s}.tile:hover{transform:translateY(-2px);border-color:#a7c495}.tile span{font-size:25px}.tile strong{display:block;margin:13px 0 4px}.tile small{color:#7a8a7c}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.btn{background:#214d36;border:0;border-radius:12px;padding:13px 20px;color:#fff;font-weight:700}.btn.secondary{background:#e8efdf;color:#214d36}.side .count{font:800 40px Manrope;letter-spacing:-.05em;margin:16px 0 0}.activity{border-top:1px solid #edf0eb;padding:14px 0}.activity b{font-size:13px}.activity p{font-size:12px;margin:3px 0}.notice{min-height:24px;color:#2b7150;font-size:13px;margin-top:14px}footer{text-align:center;color:#7b8b7b;font-size:12px;margin:25px}input.search{width:100%;border:1px solid #d6e4d6;padding:13px;border-radius:12px;margin-top:8px}body.dark{background:#12251c;color:#eef4ea}body.dark .main,body.dark .side{background:#22382b;border-color:#32503b}body.dark .tile{background:#2a4131;color:#fff;border-color:#456349}body.dark p,body.dark .tile small{color:#c0cdbd}body.dark .nav button:not(.active){background:#25432e;color:#e9f2e6;border-color:#456349}body.dark .feature{background:#355740}body.dark .btn.secondary{background:#456349;color:white}@media(max-width:750px){.wrap{padding:15px}.layout{grid-template-columns:1fr}.main,.side{padding:19px}.tiles{grid-template-columns:1fr 1fr}.art{width:75px;height:75px;font-size:29px}.feature{min-height:150px;padding:16px}}@media(max-width:390px){.tiles{grid-template-columns:1fr}.pill{font-size:10px}.nav button{padding:12px 9px}}
</style></head><body><div class="wrap"><header class="top"><div class="logo">ugo<span>.</span></div><span class="pill">PRÉVIA VISUAL · DEMO ISOLADA</span></header><nav class="nav" aria-label="Alternar aplicativo"><button data-role="client" class="active" aria-pressed="true">Cliente</button><button data-role="provider" aria-pressed="false">Profissional</button><button data-role="admin" aria-pressed="false">Admin</button></nav><div class="layout"><main class="main"><div class="kicker" id="kicker"></div><h1 id="title"></h1><p id="subtitle"></p><div class="feature"><div><strong id="hero"></strong><p id="heroText"></p></div><div class="art" id="art" aria-hidden="true"></div></div><div class="label" id="section"></div><label><span class="kicker">BUSCA NA DEMONSTRAÇÃO</span><input class="search" id="search" placeholder="Filtrar opções desta tela" aria-label="Filtrar opções"></label><div class="tiles" id="tiles"></div><div class="buttons"><button id="primary" class="btn"></button><button id="theme" class="btn secondary">Alternar tema</button></div><div class="notice" id="notice" role="status" aria-live="polite"></div></main><aside class="side"><div class="kicker" id="sideKicker"></div><h2 id="sideTitle"></h2><div class="count" id="stat"></div><p id="statLabel"></p><div class="label">Visão rápida</div><div id="activity"></div></aside></div><footer>Design exploratório inspirado nas referências UGO Platform e PR #9. Dados simulados. Sem autenticação, GPS, pagamentos ou pedidos reais.</footer></div><script>
const views={
client:{k:"UGO CLIENTE / ENCONTRE O PROFISSIONAL CERTO",title:"Sua casa em boas mãos.",sub:"Encontre profissionais para resolver o que importa, de forma simples.",hero:"O que você precisa hoje?",desc:"Explore categorias, escolha um serviço e acompanhe tudo em um só lugar.",art:"✳",section:"Serviços populares",items:[["🧽","Limpeza","Ambientes impecáveis"],["🛠️","Reparos","Pequenos consertos"],["💧","Hidráulica","Ajuda quando precisar"],["⚡","Elétrica","Instalações e reparos"],["🎨","Pintura","Renove seus espaços"],["🌿","Jardinagem","Cuidado externo"]],primary:"Simular busca",side:"SUA EXPERIÊNCIA",sideTitle:"Tudo sob controle",stat:"06",statLabel:"Categorias de demonstração",activity:[["Faça um pedido","Descreva o que você precisa"],["Acompanhe","Veja cada etapa com clareza"],["Avalie","Compartilhe sua experiência"]]},
provider:{k:"UGO PROFISSIONAL / CENTRAL DE TRABALHO",title:"Mais oportunidades. Menos complicações.",sub:"Organize sua rotina, ofertas e ganhos com total clareza.",hero:"Seu trabalho começa aqui.",desc:"Acompanhe oportunidades, localização e próximas tarefas.",art:"⚒",section:"Ferramentas de trabalho",items:[["📍","Minha região","GPS e disponibilidade"],["📋","Ofertas","Novos serviços"],["🧰","Meus trabalhos","Ativos e concluídos"],["📅","Agenda","Próximos serviços"],["💰","Ganhos","Valores e comissões"],["👤","Meu perfil","Documentos e tarifas"]],primary:"Simular status online",side:"SEU DIA",sideTitle:"Visão profissional",stat:"03",statLabel:"Ofertas fictícias",activity:[["Localização real","Obrigatória na operação verdadeira"],["Próximo serviço","Dados completos antes de aceitar"],["Segurança","Aprovação humana e evidências"]]},
admin:{k:"UGO ADMIN / OPERAÇÕES",title:"Controle inteligente da operação.",sub:"Pessoas, serviços e incidentes em uma só plataforma.",hero:"Prioridades sem perder o contexto.",desc:"Acesse indicadores, pendências e revisões por área.",art:"◎",section:"Módulos administrativos",items:[["👥","Usuários","Clientes e profissionais"],["✅","Aprovações","Revisão documental"],["📊","Serviços","Estado das solicitações"],["⚠️","Disputas","Casos em análise"],["💳","Financeiro","Pagamentos e taxas"],["🔔","Alertas","Eventos relevantes"]],primary:"Simular painel de alertas",side:"OPERAÇÃO",sideTitle:"Resumo executivo",stat:"28",statLabel:"Serviços fictícios",activity:[["Perfis pendentes","Revisar documentos"],["Pedidos ativos","Monitorar andamento"],["Auditoria","Permissões controladas no backend"]]}
};let role="client",online=false;const $=x=>document.getElementById(x);function render(){let v=views[role];["title","section","stat","statLabel","sideTitle"].forEach(k=>$(k).textContent=v[k]);$("kicker").textContent=v.k;$("subtitle").textContent=v.sub;$("hero").textContent=v.hero;$("heroText").textContent=v.desc;$("art").textContent=v.art;$("sideKicker").textContent=v.side;$("primary").textContent=role==="provider"?(online?"Simular status offline":"Simular status online"):v.primary;$("activity").replaceChildren(...v.activity.map(([a,b])=>{let d=document.createElement("div");d.className="activity";let h=document.createElement("b"),p=document.createElement("p");h.textContent=a;p.textContent=b;d.append(h,p);return d}));let query=$("search").value.toLocaleLowerCase();let matches=v.items.filter(x=>x.join(" ").toLocaleLowerCase().includes(query));$("tiles").replaceChildren(...matches.map(([icon,name,description])=>{let b=document.createElement("button");b.className="tile";let i=document.createElement("span"),h=document.createElement("strong"),s=document.createElement("small");i.textContent=icon;h.textContent=name;s.textContent=description;b.append(i,h,s);b.onclick=()=>{$("notice").textContent=name+" é uma seção de demonstração, sem acesso a dados reais."};return b}));if(!matches.length)$("notice").textContent="Nenhuma opção corresponde à busca.";document.querySelectorAll("[data-role]").forEach(b=>{b.classList.toggle("active",b.dataset.role===role);b.setAttribute("aria-pressed",b.dataset.role===role?"true":"false")})}document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{role=b.dataset.role;$("search").value="";$("notice").textContent="";render()});$("search").oninput=()=>{$("notice").textContent="";render()};$("theme").onclick=()=>{document.body.classList.toggle("dark");$("notice").textContent=document.body.classList.contains("dark")?"Tema escuro ativado.":"Tema claro ativado."};$("primary").onclick=()=>{if(role==="provider"){online=!online;render();$("notice").textContent="Disponibilidade alterada apenas nesta demonstração."}else $("notice").textContent=role==="client"?"Busca visual de exemplo; nenhum pedido foi criado.":"Painel fictício; nenhuma operação administrativa foi executada."};render();
</script></body></html>
